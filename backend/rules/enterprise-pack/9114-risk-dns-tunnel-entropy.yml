id: 9114
name: RISK-DNS-TUNNEL-ENTROPY
dataTypes:
  - dns
  - netconn
  - network
category: Command and Control
technique: "T1071.004 - Application Layer Protocol: DNS"
mitre:
  tactics: ["TA0011", "TA0010"]
  attacks: ["T1071.004", "T1048.003"]
adversary: origin
description: >
  Staging risk pack (DET-SEQ). Accumulates risk for suspiciously long DNS
  query labels consistent with tunneling, rather than a one-shot CEL alert.
references:
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1048/003/
  - https://attack.mitre.org/tactics/TA0011/
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
deduplicateBy:
  - origin.ip
  - origin.host
groupBy:
  - origin.ip
riskScore: 20
where: 'raw.matches("(?i).*[A-Za-z0-9+/=_-]{40,}\\.(com|net|org|info|xyz|top|cc).*")'
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: origin.ip
        operator: filter_term
        value: "{{.origin.ip}}"
    within: 10m
    count: 8
