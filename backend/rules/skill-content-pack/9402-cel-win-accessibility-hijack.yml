id: 9402
name: CEL-WIN-ACCESSIBILITY-HIJACK
dataTypes:
  - windows
  - wineventlog
  - process
  - registry
category: Persistence
technique: "T1546.008 - Event Triggered Execution: Accessibility Features"
mitre:
  tactics: ["TA0003", "TA0004"]
  attacks: ["T1546.008", "T1546.012"]
adversary: origin
description: >
  Skill content pack. Detects sticky-keys / accessibility binary replacement or
  IFEO Debugger hijack of sethc, utilman, osk, magnify, or DisplaySwitch. This
  yields a SYSTEM shell at the logon screen without valid credentials. False
  positives: accessibility-tool packaging, OS upgrade file copies, and approved
  IFEO debugging of those binaries. Baseline Image Path writes under System32
  for those names before enabling in production.
references:
  - https://attack.mitre.org/techniques/T1546/008/
  - https://attack.mitre.org/techniques/T1546/012/
  - https://attack.mitre.org/tactics/TA0003/
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
deduplicateBy:
  - origin.host
  - origin.command
groupBy:
  - origin.host
where: >
  raw.matches("(?i).*(sethc|utilman|osk|magnify|DisplaySwitch|AtBroker)\\.exe.*")
  && (raw.matches("(?i).*(Image File Execution Options|Debugger|IFEO|cmd\\.exe|cmd /k|cmd /c).*")
      || raw.matches("(?i).*(copy|move|replace|takeown|icacls).*(System32\\\\(sethc|utilman|osk)).*"))
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: origin.host
        operator: filter_term
        value: "{{.origin.host}}"
    within: 10m
    count: 1
