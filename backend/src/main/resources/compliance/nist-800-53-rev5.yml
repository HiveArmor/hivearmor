        description: Develop and disseminate an organization-wide information security program plan.
        severity: high
      - id: PM-2
        name: Information Security Program Leadership Role
        description: Appoint a senior agency information security officer.
        severity: high
      - id: PM-3
        name: Information Security and Privacy Resources
        description: Include resources needed to implement security and privacy programs.
        severity: medium
      - id: PM-4
