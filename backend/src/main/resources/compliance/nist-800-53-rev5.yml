framework:
  id: NIST-800-53-R5
  name: NIST SP 800-53 Revision 5
  shortName: 800-53r5
  version: "5.1.1"
  description: >
    Security and Privacy Controls for Information Systems and Organizations.

families:
  - id: AC
    name: Access Control
    controls:
      - id: AC-1
        name: Policy and Procedures
        description: Develop, document, and disseminate access control policy.
        severity: medium
      - id: AC-2
        name: Account Management
        description: Define and document account management requirements.
        severity: high
      - id: AC-3
        name: Access Enforcement
        description: Enforce approved authorizations for logical access.
        severity: high
      - id: AC-4
        name: Information Flow Enforcement
        description: Enforce approved authorizations for controlling information flow.
        severity: high
      - id: AC-5
        name: Separation of Duties
        description: Define and enforce duties separation policies.
        severity: medium
      - id: AC-6
        name: Least Privilege
        description: Employ the principle of least privilege.
        severity: high
      - id: AC-7
        name: Unsuccessful Logon Attempts
        description: Enforce a limit of consecutive invalid logon attempts.
        severity: high
      - id: AC-8
        name: System Use Notification
        description: Display an approved system use notification message.
        severity: low
      - id: AC-9
        name: Previous Logon Notification
        description: Notify the user upon successful logon of previous attempts.
        severity: low
      - id: AC-10
        name: Concurrent Session Control
        description: Limit the number of concurrent sessions.
        severity: medium
      - id: AC-11
        name: Device Lock
        description: Prevent further access to the system by initiating a device lock.
        severity: medium
      - id: AC-12
        name: Session Termination
        description: Automatically terminate a user session after defined conditions.
        severity: medium
      - id: AC-14
        name: Permitted Actions Without Identification or Authentication
        description: Identify specific user actions permitted without identification.
        severity: medium
      - id: AC-17
        name: Remote Access
        description: Establish and document usage restrictions for remote access.
        severity: high
      - id: AC-18
        name: Wireless Access
        description: Establish usage restrictions for wireless access.
        severity: medium
      - id: AC-19
        name: Access Control for Mobile Devices
        description: Establish usage restrictions for mobile devices.
        severity: medium
      - id: AC-20
        name: Use of External Systems
        description: Establish terms for use of external systems.
        severity: high
      - id: AC-21
        name: Information Sharing
        description: Enforce information-sharing decisions by authorized users.
        severity: medium
      - id: AC-22
        name: Publicly Accessible Content
        description: Designate individuals authorized to post publicly accessible content.
        severity: medium

  - id: AT
    name: Awareness and Training
    controls:
      - id: AT-1
        name: Policy and Procedures
        description: Develop, document, and disseminate awareness and training policy.
        severity: medium
      - id: AT-2
        name: Literacy Training and Awareness
        description: Provide security and privacy literacy training.
        severity: medium
      - id: AT-3
        name: Role-Based Training
        description: Provide role-based security and privacy training.
        severity: medium
      - id: AT-4
        name: Training Records
        description: Document and monitor training activities.
        severity: low

  - id: AU
    name: Audit and Accountability
    controls:
      - id: AU-1
        name: Policy and Procedures
        description: Develop, document, and disseminate audit and accountability policy.
        severity: medium
      - id: AU-2
        name: Event Logging
        description: Identify types of events the system is capable of logging.
        severity: high
      - id: AU-3
        name: Content of Audit Records
        description: Ensure audit records contain required information.
        severity: high
      - id: AU-4
        name: Audit Log Storage Capacity
        description: Allocate audit log storage capacity.
        severity: medium
      - id: AU-5
        name: Response to Audit Logging Process Failures
        description: Alert personnel of audit logging process failures.
        severity: high
      - id: AU-6
        name: Audit Record Review, Analysis, and Reporting
        description: Review and analyze system audit records.
        severity: high
      - id: AU-7
        name: Audit Record Reduction and Report Generation
        description: Provide audit record reduction and report generation capability.
        severity: medium
      - id: AU-8
        name: Time Stamps
        description: Use internal system clocks to generate time stamps for audit records.
        severity: medium
      - id: AU-9
        name: Protection of Audit Information
        description: Protect audit information and audit logging tools from unauthorized access.
        severity: high
      - id: AU-10
        name: Non-Repudiation
        description: Provide irrefutable evidence that an action has occurred.
        severity: medium
      - id: AU-11
        name: Audit Record Retention
        description: Retain audit records to provide support for investigations.
        severity: medium
      - id: AU-12
        name: Audit Record Generation
        description: Provide audit record generation capability.
        severity: high

  - id: CA
    name: Assessment, Authorization, and Monitoring
    controls:
      - id: CA-1
        name: Policy and Procedures
        description: Develop, document, and disseminate assessment and authorization policy.
        severity: medium
      - id: CA-2
        name: Control Assessments
        description: Develop a control assessment plan and assess controls.
        severity: high
      - id: CA-3
        name: Information Exchange
        description: Approve and manage the exchange of information between systems.
        severity: high
      - id: CA-5
        name: Plan of Action and Milestones
        description: Develop and update a plan of action and milestones.
        severity: medium
      - id: CA-6
        name: Authorization
        description: Authorize the system before operation.
        severity: high
      - id: CA-7
        name: Continuous Monitoring
        description: Develop a system-level continuous monitoring strategy.
        severity: high
      - id: CA-8
        name: Penetration Testing
        description: Conduct penetration testing.
        severity: medium
      - id: CA-9
        name: Internal System Connections
        description: Authorize internal connections to the system.
        severity: medium

  - id: CM
    name: Configuration Management
    controls:
      - id: CM-1
        name: Policy and Procedures
        description: Develop, document, and disseminate configuration management policy.
        severity: medium
      - id: CM-2
        name: Baseline Configuration
        description: Develop, document, and maintain a baseline configuration.
        severity: high
      - id: CM-3
        name: Configuration Change Control
        description: Determine and document types of changes under configuration control.
        severity: high
      - id: CM-4
        name: Impact Analyses
        description: Analyze changes to determine potential security and privacy impacts.
        severity: medium
      - id: CM-5
        name: Access Restrictions for Change
        description: Define and enforce access restrictions for change.
        severity: high
      - id: CM-6
        name: Configuration Settings
        description: Establish and document configuration settings.
        severity: high
      - id: CM-7
        name: Least Functionality
        description: Configure the system to provide only mission-essential capabilities.
        severity: high
      - id: CM-8
        name: System Component Inventory
        description: Develop and document an inventory of system components.
        severity: medium
      - id: CM-9
        name: Configuration Management Plan
        description: Develop, document, and implement a configuration management plan.
        severity: medium
      - id: CM-10
        name: Software Usage Restrictions
        description: Use software in accordance with contract agreements and copyright laws.
        severity: medium
      - id: CM-11
        name: User-Installed Software
        description: Establish and enforce policies governing user-installed software.
        severity: medium

  - id: CP
    name: Contingency Planning
    controls:
      - id: CP-1
        name: Policy and Procedures
        description: Develop, document, and disseminate contingency planning policy.
        severity: medium
      - id: CP-2
        name: Contingency Plan
        description: Develop a contingency plan for the system.
        severity: high
      - id: CP-3
        name: Contingency Training
        description: Provide contingency training to system users.
        severity: medium
      - id: CP-4
        name: Contingency Plan Testing
        description: Test the contingency plan.
        severity: medium
      - id: CP-6
        name: Alternate Storage Site
        description: Establish an alternate storage site.
        severity: high
      - id: CP-7
        name: Alternate Processing Site
        description: Establish an alternate processing site.
        severity: high
      - id: CP-8
        name: Telecommunications Services
        description: Establish alternate telecommunications services.
        severity: medium
      - id: CP-9
        name: System Backup
        description: Conduct backups of system-level and user-level information.
        severity: high
      - id: CP-10
        name: System Recovery and Reconstitution
        description: Provide for the recovery and reconstitution of the system.
        severity: high

  - id: IA
    name: Identification and Authentication
    controls:
      - id: IA-1
        name: Policy and Procedures
        description: Develop, document, and disseminate identification and authentication policy.
        severity: medium
      - id: IA-2
        name: Identification and Authentication (Organizational Users)
        description: Uniquely identify and authenticate organizational users.
        severity: critical
      - id: IA-3
        name: Device Identification and Authentication
        description: Uniquely identify and authenticate devices before establishing connection.
        severity: high
      - id: IA-4
        name: Identifier Management
        description: Manage system identifiers by receiving authorization.
        severity: high
      - id: IA-5
        name: Authenticator Management
        description: Manage system authenticators by verifying identity.
        severity: critical
      - id: IA-6
        name: Authentication Feedback
        description: Obscure feedback of authentication information during authentication.
        severity: medium
      - id: IA-7
        name: Cryptographic Module Authentication
        description: Implement mechanisms for authenticating to a cryptographic module.
        severity: high
      - id: IA-8
        name: Identification and Authentication (Non-Organizational Users)
        description: Uniquely identify and authenticate non-organizational users.
        severity: high
      - id: IA-11
        name: Re-Authentication
        description: Require users to re-authenticate when defined circumstances require it.
        severity: medium
      - id: IA-12
        name: Identity Proofing
        description: Identity proof users that require accounts.
        severity: high

  - id: IR
    name: Incident Response
    controls:
      - id: IR-1
        name: Policy and Procedures
        description: Develop, document, and disseminate incident response policy.
        severity: medium
      - id: IR-2
        name: Incident Response Training
        description: Provide incident response training to system users.
        severity: medium
      - id: IR-3
        name: Incident Response Testing
        description: Test the effectiveness of the incident response capability.
        severity: medium
      - id: IR-4
        name: Incident Handling
        description: Implement an incident handling capability for incidents.
        severity: high
      - id: IR-5
        name: Incident Monitoring
        description: Track and document incidents on an ongoing basis.
        severity: high
      - id: IR-6
        name: Incident Reporting
        description: Require personnel to report suspected incidents.
        severity: medium
      - id: IR-7
        name: Incident Response Assistance
        description: Provide an incident response support resource.
        severity: medium
      - id: IR-8
        name: Incident Response Plan
        description: Develop an incident response plan.
        severity: high

  - id: MA
    name: Maintenance
    controls:
      - id: MA-1
        name: Policy and Procedures
        description: Develop, document, and disseminate maintenance policy.
        severity: medium
      - id: MA-2
        name: Controlled Maintenance
        description: Schedule, perform, and document maintenance and repairs.
        severity: medium
      - id: MA-3
        name: Maintenance Tools
        description: Approve, control, and monitor maintenance tools.
        severity: medium
      - id: MA-4
        name: Nonlocal Maintenance
        description: Approve and monitor nonlocal maintenance activities.
        severity: high
      - id: MA-5
        name: Maintenance Personnel
        description: Establish a process for maintenance personnel authorization.
        severity: medium
      - id: MA-6
        name: Timely Maintenance
        description: Obtain maintenance support within defined time period.
        severity: medium

  - id: MP
    name: Media Protection
    controls:
      - id: MP-1
        name: Policy and Procedures
        description: Develop, document, and disseminate media protection policy.
        severity: medium
      - id: MP-2
        name: Media Access
        description: Restrict access to digital and non-digital media.
        severity: medium
      - id: MP-3
        name: Media Marking
        description: Mark system media indicating distribution limitations.
        severity: low
      - id: MP-4
        name: Media Storage
        description: Physically control and securely store media.
        severity: medium
      - id: MP-5
        name: Media Transport
        description: Protect and control media during transport.
        severity: medium
      - id: MP-6
        name: Media Sanitization
        description: Sanitize system media prior to disposal or reuse.
        severity: high
      - id: MP-7
        name: Media Use
        description: Restrict the use of certain types of media.
        severity: medium

  - id: PE
    name: Physical and Environmental Protection
    controls:
      - id: PE-1
        name: Policy and Procedures
        description: Develop, document, and disseminate physical and environmental protection policy.
        severity: medium
      - id: PE-2
        name: Physical Access Authorizations
        description: Develop, approve, and maintain a list of authorized personnel.
        severity: high
      - id: PE-3
        name: Physical Access Control
        description: Enforce physical access authorizations at entry and exit points.
        severity: high
      - id: PE-4
        name: Access Control for Transmission
        description: Control physical access to system distribution and transmission lines.
        severity: medium
      - id: PE-5
        name: Access Control for Output Devices
        description: Control physical access to output from output devices.
        severity: medium
      - id: PE-6
        name: Monitoring Physical Access
        description: Monitor physical access to the facility.
        severity: high
      - id: PE-8
        name: Visitor Access Records
        description: Maintain visitor access records to the facility.
        severity: medium
      - id: PE-9
        name: Power Equipment and Cabling
        description: Protect power equipment and power cabling.
        severity: medium
      - id: PE-10
        name: Emergency Shutoff
        description: Provide the capability to shut off power.
        severity: medium
      - id: PE-11
        name: Emergency Power
        description: Provide an uninterruptible power supply.
        severity: medium
      - id: PE-12
        name: Emergency Lighting
        description: Employ and maintain automatic emergency lighting.
        severity: low
      - id: PE-13
        name: Fire Protection
        description: Employ and maintain fire detection and suppression systems.
        severity: medium
      - id: PE-14
        name: Environmental Controls
        description: Maintain temperature and humidity levels.
        severity: medium
      - id: PE-15
        name: Water Damage Protection
        description: Protect the system from damage from water leakage.
        severity: medium
      - id: PE-16
        name: Delivery and Removal
        description: Authorize and control information system components entering and exiting.
        severity: medium
      - id: PE-17
        name: Alternate Work Site
        description: Employ management and security controls at alternate work sites.
        severity: medium

  - id: PL
    name: Planning
    controls:
      - id: PL-1
        name: Policy and Procedures
        description: Develop, document, and disseminate planning policy.
        severity: medium
      - id: PL-2
        name: System Security and Privacy Plans
        description: Develop security and privacy plans for the system.
        severity: high
      - id: PL-4
        name: Rules of Behavior
        description: Establish rules describing responsibilities and expected behavior.
        severity: medium
      - id: PL-8
        name: Security and Privacy Architectures
        description: Develop security and privacy architectures for the system.
        severity: high
      - id: PL-10
        name: Baseline Selection
        description: Select a control baseline for the system.
        severity: medium
      - id: PL-11
        name: Baseline Tailoring
        description: Tailor the selected control baseline.
