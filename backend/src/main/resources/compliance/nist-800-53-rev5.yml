        description: Implement a plan of action and milestones process.
        severity: medium
      - id: PM-5
        name: System Inventory
        description: Develop and maintain an inventory of organizational systems.
        severity: medium
      - id: PM-6
        name: Measures of Performance
        description: Develop, monitor, and report on security and privacy measures.
        severity: medium
      - id: PM-7
        name: Enterprise Architecture
        description: Develop and maintain an enterprise architecture.
        severity: medium
      - id: PM-9
        name: Risk Management Strategy
        description: Develop a comprehensive strategy for managing risk.
        severity: high
      - id: PM-10
        name: Authorization Process
        description: Manage the security and privacy state of organizational systems.
        severity: medium
      - id: PM-11
        name: Mission and Business Process Definition
        description: Define organizational mission and business processes.
        severity: medium

  - id: PS
    name: Personnel Security
    controls:
      - id: PS-1
        name: Policy and Procedures
        description: Develop, document, and disseminate personnel security policy.
        severity: medium
      - id: PS-2
        name: Position Risk Designation
        description: Assign a risk designation to all organizational positions.
        severity: medium
      - id: PS-3
        name: Personnel Screening
        description: Screen individuals prior to authorizing access.
        severity: high
      - id: PS-4
        name: Personnel Termination
        description: Upon termination, disable access and retrieve credentials.
        severity: high
      - id: PS-5
        name: Personnel Transfer
        description: Review and confirm ongoing need for access upon transfer.
        severity: medium
      - id: PS-6
        name: Access Agreements
        description: Require individuals to sign access agreements.
        severity: medium
      - id: PS-7
        name: External Personnel Security
        description: Establish personnel security requirements for external providers.
        severity: medium
      - id: PS-8
