# Rule version v1.0.0

dataTypes:
  - wineventlog
name: "Windows: Active Directory Reconnaissance Tooling"
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
category: Discovery
technique: "T1482 - Domain Trust Discovery"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1482/
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
description: |
  Detects execution of Active Directory enumeration tooling — nltest (domain trusts /
  DC list), dsquery, or the AD-recon utilities SharpHound / AzureHound / adfind that
  map users, groups, trusts, and attack paths. AD reconnaissance almost always
  precedes lateral movement and privilege escalation; catching the enumeration binary
  is an early, high-signal step in the intrusion.

  Next Steps:
  1. Identify the host and account running the AD-recon tool
  2. Confirm it is not a sanctioned red-team exercise or an authorized AD audit
  3. Treat SharpHound/AzureHound/adfind execution as high-confidence attacker activity
  4. Correlate with a preceding foothold and check for follow-on Kerberoasting / DCSync / lateral movement
  5. If unauthorized, isolate the host, reset the account, and review what the identity could reach in AD
where: |
  equals("log.eventCode", 4688) &&
  regexMatch("log.eventDataProcessName", "(?i)\\\\(nltest|dsquery|adfind|sharphound|azurehound|bloodhound)\\.exe$")
groupBy:
  - origin.host
  - target.user
