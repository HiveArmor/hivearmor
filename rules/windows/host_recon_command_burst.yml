# Rule version v1.0.0

dataTypes:
  - wineventlog
name: "Windows: Host Reconnaissance Command Burst"
impact:
  confidentiality: 2
  integrity: 1
  availability: 1
category: Discovery
technique: "T1082 - System Information Discovery"
adversary: origin
references:
  - https://attack.mitre.org/tactics/TA0007/
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1016/
description: |
  Detects a burst of built-in host-reconnaissance utilities launched by the same
  host in a short window — whoami, systeminfo, ipconfig, netstat, tasklist, net,
  sc/query, nltest. Any one of these is routine admin activity; a rapid sequence of
  several distinct recon binaries from one host is the classic post-compromise
  "situational awareness" step an operator runs immediately after gaining a foothold.

  This rule matches on the process image name (the Windows event schema exposes the
  binary, not its arguments) and correlates a burst, so it fires on the pattern
  rather than any single command.

  Next Steps:
  1. Identify the host, the account, and the exact sequence of recon binaries run
  2. Determine whether this was a sanctioned admin/inventory task or unexpected
  3. Correlate with a preceding logon (especially remote/4624 type 3/10) or a new process tree
  4. Check what the same host/account did next — lateral movement, credential access, or staging
  5. If unauthorized, isolate the host, preserve the process tree, and reset the account
where: |
  equals("log.eventCode", 4688) &&
  regexMatch("log.eventDataProcessName", "(?i)\\\\(whoami|systeminfo|ipconfig|netstat|tasklist|nltest|hostname|net1?|sc|reg|route|arp|query|qwinsta|quser)\\.exe$")
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: log.eventCode
        operator: filter_term
        value: '4688'
      - field: log.eventDataProcessName
        operator: filter_match
        value: 'exe'
    within: 5m
    count: 5
groupBy:
  - origin.host
  - target.user
