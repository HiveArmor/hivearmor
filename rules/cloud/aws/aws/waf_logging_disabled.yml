# Rule version v1.0.0

dataTypes:
  - aws
name: AWS WAF Logging Disabled
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Defense Evasion
technique: "T1562.008 - Impair Defenses: Disable or Modify Cloud Logs"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1562/008/
description: |
  Detects disabling of AWS WAF logging — DeleteLoggingConfiguration (or PutLoggingConfiguration
  that redirects/reduces logging). WAF logs are the record of blocked and allowed requests;
  turning them off blinds the SOC to the very exploit attempts the WAF would otherwise
  reveal, so an attacker preparing to probe or bypass the WAF removes its logging first. WAF
  logging config is set once and rarely changed.

  Next Steps:
  1. Identify the principal, source IP, and the Web ACL whose logging was removed/changed
  2. A DeleteLoggingConfiguration on a production Web ACL is high-signal
  3. Confirm it matches an approved change, not an ad-hoc action
  4. If unauthorized, restore logging and quantify the blind window
  5. Correlate with WAF rule/ACL changes or exploit traffic in the same window
where: |
  oneOf("log.eventSource", ["waf.amazonaws.com", "waf-regional.amazonaws.com", "wafv2.amazonaws.com"]) &&
  oneOf("log.eventName", ["DeleteLoggingConfiguration", "PutLoggingConfiguration"])
groupBy:
  - log.userIdentityArn
  - log.sourceIPAddress
