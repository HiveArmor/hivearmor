# Rule version v1.0.0

dataTypes:
  - aws
name: AWS EC2 Windows Password Data Retrieval
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
category: Credential Access
technique: "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1552/005/
  - https://attack.mitre.org/tactics/TA0006/
description: |
  Detects retrieval of the encrypted local Administrator password for Windows EC2 instances
  (GetPasswordData), especially a burst across many instances. With the instance's private
  key, GetPasswordData yields the local admin password — an attacker who has a key pair (or
  can pair one via ModifyInstanceAttribute) harvests admin credentials for RDP/lateral
  movement across the fleet. A sweep of GetPasswordData from one principal is a strong
  credential-access signal.

  Next Steps:
  1. Identify the principal, source IP, and the instances whose password data was retrieved
  2. Confirm it matches a sanctioned provisioning/automation workflow
  3. Flag a burst across multiple instances, or calls from an interactive/assumed-role identity, as high-signal
  4. If unauthorized, rotate the affected instances' local admin passwords and revoke the calling credential
  5. Correlate with subsequent RDP logons or lateral movement to those hosts
where: |
  equals("log.eventSource", "ec2.amazonaws.com") &&
  equals("log.eventName", "GetPasswordData")
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: log.userIdentityArn
        operator: filter_term
        value: '{{.log.userIdentityArn}}'
      - field: log.eventName
        operator: filter_term
        value: 'GetPasswordData'
    within: 15m
    count: 3
groupBy:
  - log.userIdentityArn
  - log.sourceIPAddress
