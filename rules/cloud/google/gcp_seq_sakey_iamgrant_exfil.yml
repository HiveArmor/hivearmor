id: 9135
name: SEQ-GCP-SAKEY-IAMGRANT-EXFIL
dataTypes:
  - google
category: Exfiltration
technique: "T1078.004 - Valid Accounts: Cloud Accounts"
mitre:
  tactics: ["TA0003", "TA0004", "TA0010"]
  attacks: ["T1098.001", "T1548.005", "T1537"]
adversary: origin
description: >
  Staging sequence pack (DET-SEQ). GCP project-takeover kill chain by one identity:
  a service-account key is created or an access token is minted via impersonation
  (credential planting), followed by an IAM privilege grant (SetIamPolicy adding a
  privileged binding), followed by bulk Cloud Storage read (data exfiltration) — each
  within its window. Each stage exists individually as a GCP rule; the ordered chain
  from one principal is a high-confidence compromised-identity signal.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://attack.mitre.org/techniques/T1548/005/
  - https://attack.mitre.org/techniques/T1537/
  - https://attack.mitre.org/tactics/TA0010/
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
deduplicateBy:
  - adversary.user
groupBy:
  - adversary.user
sequence:
  - where: 'oneOf("log.protoPayloadMethodName", ["google.iam.admin.v1.CreateServiceAccountKey", "CreateServiceAccountKey", "GenerateAccessToken", "SignJwt", "SignBlob"]) || raw.matches("(?i).*(CreateServiceAccountKey|GenerateAccessToken|SignJwt|SignBlob).*")'
    within: 30m
  - where: 'oneOf("log.protoPayloadMethodName", ["SetIamPolicy", "google.iam.admin.v1.SetIAMPolicy"]) || raw.matches("(?i).*(SetIamPolicy|setIamPolicy).*")'
    within: 60m
  - where: 'oneOf("log.protoPayloadMethodName", ["storage.objects.get", "storage.objects.list", "google.storage.objects.get"]) || raw.matches("(?i).*(storage\\.objects\\.(get|list)).*")'
    within: 120m
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: adversary.user
        operator: filter_term
        value: "{{.adversary.user}}"
      - field: log.protoPayloadMethodName
        operator: filter_match
        value: 'SetIamPolicy CreateServiceAccountKey'
    within: 180m
    count: 1
