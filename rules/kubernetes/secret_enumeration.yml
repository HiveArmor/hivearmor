# Rule version v1.0.0

dataTypes:
  - otlp
name: Kubernetes Secret Enumerated Across Namespace
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1552.007 - Unsecured Credentials: Container API"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1552/007/
  - https://kubernetes.io/docs/concepts/configuration/secret/
description: |
  Detects repeated reads of Kubernetes Secrets through the API server (get/list on the secrets resource). Secrets hold service-account tokens, registry credentials, and TLS keys; an identity that suddenly enumerates many secrets is a strong credential-access signal, often the step after a compromised pod's token is used against the API.

  Next Steps:
  1. Identify the requesting user/service account and whether it legitimately manages secrets
  2. Determine whether the reads came from inside a pod (a compromised workload token) or an external kubeconfig
  3. Review which secrets were accessed and rotate any that hold long-lived credentials
  4. Check RBAC: a workload rarely needs list/get across all secrets — tighten to the specific secret it needs
  5. If unauthorized, revoke the service-account token, delete the pod, and audit for lateral use of the leaked credentials
where: |
  exists("log.message") &&
  contains("log.message", "\"resource\":\"secrets\"") &&
  regexMatch("log.message", "\"verb\":\"(get|list|watch)\"")
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: log.message
        operator: filter_match
        value: '"resource":"secrets"'
    within: 5m
    count: 15
groupBy:
  - log.k8s.namespace
  - log.hostname
