# Rule version v1.0.0

dataTypes:
  - macos
name: "macOS: Browser Credential Store Access"
impact:
  confidentiality: 3
  integrity: 1
  availability: 0
category: Credential Access
technique: "T1555.003 - Credentials from Password Stores: Credentials from Web Browsers"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1555/003/
description: |
  Detects a process (other than the browser itself) reading a browser credential or session
  store on macOS — Chrome/Edge/Brave "Login Data" and "Cookies", Firefox logins.json /
  key4.db / cookies.sqlite, or Safari cookie/keychain-backed stores. This complements the
  existing Keychain-dumping rule: infostealers (Atomic/Poseidon/XCSSET-style) copy these
  SQLite/JSON stores to harvest saved passwords, session cookies, and tokens for account
  takeover, often via cp/sqlite3/osascript rather than the browser.

  Next Steps:
  1. Identify the accessing process and user, and which browser store(s) were read
  2. Confirm the accessor is the legitimate browser or a sanctioned backup/MDM tool
  3. Treat cp/sqlite3/cat of Login Data / Cookies / key4.db by a non-browser process as high-signal
  4. If unauthorized, rotate the affected browser-saved credentials and invalidate active sessions
  5. Correlate with subsequent outbound transfer (exfiltration) from the same host
where: |
  (
    contains("log.eventMessage", "Login Data") ||
    contains("log.eventMessage", "Cookies.sqlite") ||
    contains("log.eventMessage", "logins.json") ||
    contains("log.eventMessage", "key4.db") ||
    contains("log.eventMessage", "cookies.sqlite") ||
    contains("log.eventMessage", "places.sqlite") ||
    (contains("log.eventMessage", "/Cookies") && contains("log.eventMessage", "Chrome"))
  ) &&
  regexMatch("log.eventMessage", "(?i)(\\bcp\\b|sqlite3|/bin/cat|\\bopen\\b|osascript|python|curl|zip|tar)") &&
  !regexMatch("log.eventMessage", "(?i)(Google Chrome|firefox|com\\.apple\\.Safari|Microsoft Edge|Brave Browser)\\.app")
groupBy:
  - adversary.host
  - adversary.user
