# Rule version v1.0.0

dataTypes:
  - "linux"
name: "System Linux: Cloud Instance Metadata (IMDS) Credential Access from Workload"
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1552/005/
  - https://attack.mitre.org/techniques/T1611/
description: |
  Detects a workload process reaching the cloud instance metadata endpoint —
  169.254.169.254 (AWS/Azure IMDS) or metadata.google.internal (GCP) — via curl/wget/python
  or similar, especially the IAM security-credentials path. A compromised container or host
  process that queries IMDS steals the node/pod's cloud role credentials and can then act as
  that role across the cloud account. This is the container-to-cloud pivot behind incidents
  such as the Capital One breach; on EC2 it also indicates IMDSv1 (no session token) is
  reachable.

  Next Steps:
  1. Identify the host/container, process, and the exact metadata path requested
  2. A hit on .../iam/security-credentials/ or the token path from an app/container process is high-signal
  3. Confirm it is not a legitimate SDK/agent (instance agent, CSI driver) making the call
  4. If unauthorized, rotate/revoke the instance-role session and enforce IMDSv2 + hop-limit 1
  5. Review what the stolen role could reach and correlate with subsequent cloud API calls
where: |
  exists("log.message") &&
  regexMatch("log.message", "(169\\.254\\.169\\.254|metadata\\.google\\.internal|metadata\\.azure\\.com)") &&
  regexMatch("log.message", "(?i)(\\bcurl\\b|\\bwget\\b|python|\\bperl\\b|\\bruby\\b|\\bnc\\b|/dev/tcp|http)") &&
  !regexMatch("log.message", "(?i)(cloud-init|amazon-ssm-agent|/usr/bin/aws\\b|google_metadata|WALinuxAgent|cloud-agent)")
groupBy:
  - origin.host
  - origin.user
