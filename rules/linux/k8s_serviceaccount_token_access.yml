# Rule version v1.0.0

dataTypes:
  - "linux"
name: "System Linux: Kubernetes Service Account Token Access"
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1552.001 - Unsecured Credentials: Credentials In Files"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1528/
description: |
  Detects a process reading the projected Kubernetes service-account token inside a pod —
  /var/run/secrets/kubernetes.io/serviceaccount/token (or the ca.crt/namespace files in that
  directory) via cat/cp/base64/curl. The SA token is the pod's bearer credential to the
  Kubernetes API; an attacker who reads it can call the API as that service account (list
  secrets, create pods, escalate via a permissive Role). Application code normally reads the
  token through client libraries, not with an ad-hoc cat/base64.

  Next Steps:
  1. Identify the pod/host, process, and whether the token itself or curl-to-API followed
  2. An interactive cat/base64/curl of the token path is high-signal vs. a client library
  3. Determine the service account's RBAC — a token with broad permissions is a serious finding
  4. If unauthorized, rotate the service account token and tighten its RoleBinding
  5. Review API-server audit logs for calls made with that token after the read
where: |
  exists("log.message") &&
  regexMatch("log.message", "/var/run/secrets/kubernetes\\.io/serviceaccount") &&
  regexMatch("log.message", "(?i)(\\bcat\\b|\\bcp\\b|base64|\\bcurl\\b|\\bwget\\b|\\btar\\b|xxd|\\bhead\\b|\\bread\\b|Authorization)")
groupBy:
  - origin.host
  - origin.user
