id: 9116
name: GRAPH-MULTI-HOST-C2-BEACON
type: graph_offense
dataTypes:
  - windows
  - linux
  - network
category: Command and Control
technique: "T1071 - Application Layer Protocol"
mitre:
  tactics: ["TA0011"]
  attacks: ["T1071", "T1105"]
adversary: origin
description: >
  Staging graph pack (DET-SEQ). Three or more internal hosts communicated with
  the same external IP within six hours — consistent with a shared C2 beacon.
  Requires Neo4j (NEO4J_ENABLED) — STAGING CANDIDATE.
references:
  - https://attack.mitre.org/techniques/T1071/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/tactics/TA0011/
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
cypherQuery: |
  MATCH (h:Host)-[c:COMMUNICATED_WITH]->(extIP:IpAddress)
  WHERE NOT extIP.address STARTS WITH '10.'
    AND NOT extIP.address STARTS WITH '192.168.'
    AND NOT extIP.address STARTS WITH '172.'
    AND c.lastSeen > datetime() - duration('PT6H')
  WITH extIP, count(DISTINCT h) AS hostCount, collect(DISTINCT h.hostname)[0..5] AS sampleHosts
  WHERE hostCount >= 3
  RETURN extIP.address  AS c2IP,
         hostCount,
         sampleHosts,
         extIP.riskScore AS riskScore
  LIMIT 20
alertFields:
  - c2IP
  - hostCount
  - sampleHosts
  - riskScore
checkIntervalSeconds: 120
