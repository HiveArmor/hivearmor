id: 9118
name: GRAPH-PASSWORD-SPRAY-MULTI-ACCOUNT
type: graph_offense
dataTypes:
  - windows
  - linux
category: Credential Access
technique: "T1110.003 - Brute Force: Password Spraying"
mitre:
  tactics: ["TA0006"]
  attacks: ["T1110.003"]
adversary: origin
description: >
  Staging graph pack (DET-SEQ). A single host recorded login attempts for five
  or more distinct accounts within one hour — consistent with password spray.
  Requires Neo4j (NEO4J_ENABLED) — STAGING CANDIDATE.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://attack.mitre.org/tactics/TA0006/
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
cypherQuery: |
  MATCH (u:User)-[r:LOGGED_INTO]->(h:Host)
  WHERE r.lastSeen > datetime() - duration('PT1H')
  WITH h, count(DISTINCT u) AS accountCount, collect(DISTINCT u.username)[0..10] AS accounts
  WHERE accountCount >= 5
  RETURN h.hostname     AS targetHost,
         accountCount,
         accounts,
         h.riskScore    AS riskScore
  LIMIT 20
alertFields:
  - targetHost
  - accountCount
  - accounts
  - riskScore
checkIntervalSeconds: 120
