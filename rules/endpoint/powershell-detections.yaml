# PowerShell Abuse Detection Rules
# DataType: powershell (Windows ETW EventID 4104 ScriptBlock logging)

dataTypes:
  - "powershell"
name: "PowerShell: Encoded Command Execution"
impact:
  confidentiality: 2
  integrity: 3
  availability: 1
category: "Defense Evasion"
technique: "T1059.001 - PowerShell"
adversary: origin
description: "A PowerShell command was executed with -EncodedCommand or -enc flag. Attackers encode commands in Base64 to obscure malicious intent from command-line logging and security tools."
references:
  - "https://attack.mitre.org/techniques/T1059/001/"
where: |
  regexMatch(toLower(safe("log.scriptBlock", safe("log.ScriptBlock", ""))), "(-encodedcommand|-enc|-e )[a-zA-Z0-9+/=]{20,}")
groupBy:
  - origin.pid
  - origin.process
deduplicateBy:
  - origin.pid
---
dataTypes:
  - "powershell"
name: "PowerShell: Download Cradle Detected"
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: "Command and Control"
technique: "T1105 - Ingress Tool Transfer"
adversary: origin
description: "A PowerShell script used a download cradle (Net.WebClient, Invoke-WebRequest, Invoke-Expression) to download and execute code from the network. This is the primary initial access technique for PowerShell-based malware."
references:
  - "https://attack.mitre.org/techniques/T1105/"
where: |
  (
    regexMatch(toLower(safe("log.scriptBlock", "")), "(new-object net\\.webclient|invoke-webrequest|wget |curl |system\\.net\\.webclient)") ||
    regexMatch(toLower(safe("log.scriptBlock", "")), "(downloadstring|downloadfile|downloaddata)")
  ) &&
  regexMatch(toLower(safe("log.scriptBlock", "")), "(http://|https://|ftp://)")
groupBy:
  - origin.process
deduplicateBy:
  - origin.pid
---
dataTypes:
  - "powershell"
name: "PowerShell: AMSI Bypass Attempt"
impact:
  confidentiality: 1
  integrity: 3
  availability: 1
category: "Defense Evasion"
technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
adversary: origin
description: "A PowerShell script attempted to bypass AMSI (Antimalware Scan Interface) using known bypass techniques. AMSI bypass is a prerequisite for running sophisticated PowerShell malware on patched systems."
references:
  - "https://attack.mitre.org/techniques/T1562/001/"
where: |
  regexMatch(toLower(safe("log.scriptBlock", "")), "(amsi(initialise|initialize|context|buf|result)|amsiutils|disable.*amsi|bypass.*amsi|[Rr]eflection\\..*amsi)")
groupBy:
  - origin.process
deduplicateBy:
  - origin.pid
---
dataTypes:
  - "powershell"
name: "PowerShell: Credential Dump via LSASS"
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: "Credential Access"
technique: "T1003.001 - OS Credential Dumping: LSASS Memory"
adversary: origin
description: "A PowerShell script accessed LSASS memory or used known credential dumping tools. This indicates an attempt to harvest credentials from memory."
references:
  - "https://attack.mitre.org/techniques/T1003/001/"
where: |
  regexMatch(toLower(safe("log.scriptBlock", "")), "(invoke-mimikatz|sekurlsa|logonpasswords|lsass|procdump|comsvcs|minidump|out-minidump)")
groupBy:
  - origin.process
deduplicateBy:
  - origin.pid
---
dataTypes:
  - "powershell"
name: "PowerShell: Add Windows Defender Exclusion"
impact:
  confidentiality: 1
  integrity: 3
  availability: 2
category: "Defense Evasion"
technique: "T1562.001 - Impair Defenses"
adversary: origin
description: "A PowerShell script added a Windows Defender exclusion path, process, or extension. Malware commonly adds exclusions before staging payloads to prevent detection."
references:
  - "https://attack.mitre.org/techniques/T1562/001/"
where: |
  regexMatch(toLower(safe("log.scriptBlock", "")), "add-mppreference.*exclusion(path|process|extension|iphpath|item)")
groupBy:
  - origin.process
deduplicateBy:
  - origin.pid
---
dataTypes:
  - "powershell"
name: "PowerShell: WMI Persistence Installation"
impact:
  confidentiality: 1
  integrity: 3
  availability: 2
category: "Persistence"
technique: "T1546.003 - Windows Management Instrumentation Event Subscription"
adversary: origin
description: "A PowerShell script created a WMI event subscription, a common persistence mechanism used by sophisticated malware to survive reboots."
references:
  - "https://attack.mitre.org/techniques/T1546/003/"
where: |
  regexMatch(toLower(safe("log.scriptBlock", "")), "(wmi(eventfilter|eventconsumer|filtertoconsumerbinding)|__eventfilter|__commandlineeventconsumer)")
groupBy:
  - origin.process
deduplicateBy:
  - origin.pid
