id: 9401
name: CEL-WIN-SHADOW-CREDENTIALS
dataTypes:
  - windows
  - wineventlog
  - process
  - windows-etw
category: Credential Access
technique: "T1098.005 - Account Manipulation: Device Registration / Shadow Credentials"
mitre:
  tactics: ["TA0006", "TA0003"]
  attacks: ["T1098.005", "T1556.006"]
adversary: origin
description: >
  Skill content pack. Detects Shadow Credentials / Whisker-style writes to
  msDS-KeyCredentialLink (Event 5136 or DSInternals/Whisker tooling). Attackers
  add a KeyCredential to a computer or user object, then authenticate as that
  principal without the password. False positives: Entra hybrid device join,
  Intune/MDM enrollment, and authorized DSInternals key-rotation jobs. Exclude
  known identity-management service accounts after a 7-day baseline.
references:
  - https://attack.mitre.org/techniques/T1098/005/
  - https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ab
  - https://attack.mitre.org/tactics/TA0006/
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
deduplicateBy:
  - origin.host
  - origin.user
  - origin.command
groupBy:
  - origin.host
  - origin.user
where: >
  raw.matches("(?i).*(msDS-KeyCredentialLink|KeyCredentialLink|Whisker(\\.py)?|pywhisker|DSInternals).*")
  && (raw.matches("(?i).*(Set-ADUser|Set-ADComputer|ldap3|AttributeLDAPDisplayName).*")
      || raw.matches("(?i).*(EventID.{0,6}5136|Directory Service Changes).*"))
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: origin.host
        operator: filter_term
        value: "{{.origin.host}}"
    within: 15m
    count: 1
