id: 9408
name: SEQ-AMSI-BYPASS-THEN-ENCODED-PS
dataTypes:
  - windows
  - powershell
  - process
  - windows-etw
category: Defense Evasion
technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
mitre:
  tactics: ["TA0005", "TA0002"]
  attacks: ["T1562.001", "T1059.001"]
adversary: origin
description: >
  Skill content pack. Sequence: AMSI/ETW bypass (AmsiScanBuffer patch,
  amsiInitFailed, or reflection against System.Management.Automation.AmsiUtils)
  followed by encoded PowerShell (-EncodedCommand/-enc) from the same host
  within 20 minutes. Isolated AMSI strings fire noisy CEL; the pair is the
  malware staging pattern. False positives: red-team tooling in a lab and
  AMSI provider self-tests. Suppress approved scanner hosts.
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.mdsec.co.uk/2018/06/exploring-powershell-amsi-and-logging-evasion/
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
deduplicateBy:
  - origin.host
  - origin.user
groupBy:
  - origin.host
sequence:
  - where: 'action == "amsi_bypass" || safe("log.action", "") == "amsi_bypass" || raw.matches("(?i).*(AmsiScanBuffer|amsiInitFailed|AmsiUtils|amsiContext|amsiSession).*")'
    within: 10m
  - where: 'action == "encoded_powershell" || safe("log.action", "") == "encoded_powershell" || (safe("origin.process", "") == "powershell.exe" && raw.matches("(?i).*(-EncodedCommand|-enc)([ =]|$).*"))'
    within: 20m
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: origin.host
        operator: filter_term
        value: "{{.origin.host}}"
      - field: log.action
        operator: filter_term
        value: amsi_bypass
    within: 20m
    count: 1
