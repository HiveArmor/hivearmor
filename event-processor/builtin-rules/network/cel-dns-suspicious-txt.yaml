id: 5241
name: CEL-NET-DNS-SUSPICIOUS
dataTypes:
  - dns
  - netconn
  - netflow
category: Command and Control
technique: "T1071.004 - Application Layer Protocol: DNS"
adversary: origin
description: Suspicious DNS TXT/NULL/HEX-heavy query patterns often used for C2.
references:
  - https://attack.mitre.org/techniques/T1071/004/
deduplicateBy:
  - origin.ip
  - origin.host
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
where: 'raw.matches("(?i).*(query.?type[^\\n]{0,12}(TXT|NULL)|qtype[^\\n]{0,12}(TXT|NULL)).*") || raw.matches("(?i).*[0-9a-f]{32,}\\.[A-Za-z0-9.-]+.*")'
