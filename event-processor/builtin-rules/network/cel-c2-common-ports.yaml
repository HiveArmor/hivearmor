id: 5281
name: CEL-NET-C2-PORTS
dataTypes:
  - dns
  - netconn
  - netflow
category: Command and Control
technique: "T1571 - Non-Standard Port"
adversary: origin
description: Outbound connection to common C2 / alternate ports (4444, 5555, 8443, 1337).
references:
  - https://attack.mitre.org/techniques/T1571/
deduplicateBy:
  - origin.ip
  - destination.ip
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
where: 'raw.matches("(?i).*(dst.?port|destination.?port|dport|server_port)[^0-9]{0,12}(4444|5555|6666|1337|31337|8443|8081).*")'
