id: 5275
name: CEL-LIN-SETUID
dataTypes:
  - linux
  - syslog
  - process
category: Privilege Escalation
technique: "T1548.001 - Abuse Elevation Control Mechanism: Setuid and Setgid"
adversary: origin
description: chmod setuid/setgid on binaries.
references:
  - https://attack.mitre.org/techniques/T1548/001/
deduplicateBy:
  - origin.host
  - origin.command
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
where: 'raw.matches("(?i).*chmod[^\\n]*[+]s[^\\n].*") || raw.matches("(?i).*chmod[^\\n]*(4755|4750|6755|u[+]s).*")'
