id: 5278
name: CEL-LIN-HISTORY-CLEAR
dataTypes:
  - linux
  - syslog
  - process
category: Defense Evasion
technique: "T1070.003 - Indicator Removal: Clear Command History"
adversary: origin
description: Shell history cleared or HISTFILE unset.
references:
  - https://attack.mitre.org/techniques/T1070/003/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 2
  integrity: 3
  availability: 1
where: 'raw.matches("(?i).*(history -c|rm[^\\n]*[.]bash_history|HISTFILE=/dev/null|unset HISTFILE).*")'
