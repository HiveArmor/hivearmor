id: ha-linux-002
title: Passwd or Shadow File Modification
status: stable
description: Detects modifications to /etc/passwd or /etc/shadow which may indicate credential access or account manipulation.
logsource:
  product: linux
  service: auditd
level: high
tags:
  - attack.credential_access
  - attack.T1003.008
detection:
  selection:
    type: PATH
    name|contains:
      - /etc/passwd
      - /etc/shadow
      - /etc/gshadow
      - /etc/group
  condition: selection
falsepositives:
  - Legitimate user management operations by administrators
  - useradd, usermod, passwd commands run by root
fields:
  - name
  - uid
  - comm
impact:
  confidentiality: high
  integrity: high
  availability: low
deduplicateBy:
  - name
  - uid
groupBy:
  - name
mitre:
  tactic: credential_access
  technique: T1003.008
