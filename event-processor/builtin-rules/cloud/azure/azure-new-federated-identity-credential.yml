id: ha-azure-009
title: New Federated Identity Credential Added to Application
status: stable
description: Detects when a federated identity credential is added to an Azure AD application registration, which can be used to obtain tokens without a password and may indicate an attacker establishing persistent access.
logsource:
  product: azure
  service: auditlogs
level: high
tags:
  - attack.persistence
  - attack.T1550.001
detection:
  selection:
    operationName: Add federated identity credential
    resultType: Success
  condition: selection
falsepositives:
  - Authorized developers setting up workload identity federation for CI/CD pipelines
  - Platform engineering configuring GitHub Actions or Azure DevOps OIDC
fields:
  - operationName
  - initiatedBy.user.userPrincipalName
  - targetResources.displayName
  - targetResources.modifiedProperties.newValue
impact:
  confidentiality: high
  integrity: high
  availability: low
deduplicateBy:
  - initiatedBy.user.userPrincipalName
  - targetResources.displayName
groupBy:
  - initiatedBy.user.userPrincipalName
mitre:
  tactic: persistence
  technique: T1550.001
