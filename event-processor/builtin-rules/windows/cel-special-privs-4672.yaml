id: 5217
name: CEL-WIN-SPECIAL-PRIVS
dataTypes:
  - wineventlog
  - windows
  - windows-etw
category: Privilege Escalation
technique: "T1078 - Valid Accounts"
adversary: origin
description: Special privileges assigned to a new logon (Event ID 4672).
references:
  - https://attack.mitre.org/techniques/T1078/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
where: >
  (has(log.eventCode) && (log.eventCode == 4672 || string(log.eventCode) == "4672"))
  || (has(log.eventId) && (string(log.eventId) == "4672"))
  || raw.matches("(?i)(event.?id|eventcode)[^0-9]{0,12}4672")
