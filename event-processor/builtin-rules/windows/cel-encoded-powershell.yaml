id: 5201
name: CEL-WIN-ENCODED-PS
dataTypes:
  - powershell
  - process
  - wineventlog
  - windows
  - windows-etw
category: Execution
technique: "T1059.001 - Command and Scripting Interpreter: PowerShell"
adversary: origin
description: Encoded PowerShell via -EncodedCommand, -enc, -e, or -EC.
references:
  - https://attack.mitre.org/techniques/T1059/001/
deduplicateBy:
  - origin.host
  - origin.command
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
where: 'raw.matches("(?i).*(-EncodedCommand|-enc|-EC|\\s-e)([ =]|$).*")'
