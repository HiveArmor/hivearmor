id: a1b2c3d4-e5f6-7890-abcd-ef1234567801
title: Token Impersonation via SeImpersonatePrivilege
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.credential_access
  - attack.privilege_escalation
  - attack.T1134
  - attack.T1134.001
detection:
  selection:
    CommandLine|contains:
      - 'ImpersonateLoggedOnUser'
      - 'DuplicateTokenEx'
      - 'CreateProcessWithTokenW'
      - 'impersonat'
  selection_tools:
    Image|endswith:
      - '\juicy-potato.exe'
      - '\rottenpotato.exe'
      - '\sweetpotato.exe'
      - '\printspoofer.exe'
      - '\roguepotato.exe'
  condition: selection or selection_tools
falsepositives:
  - Legitimate administrative tools performing token operations
  - Authorized privilege management software
impact:
  confidentiality: high
  integrity: high
  availability: low
deduplicateBy:
  - ComputerName
  - Image
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1134.001
