id: a7b8c9d0-e1f2-3456-abcd-567890123407
title: Group Policy Preference Credential Harvesting
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.credential_access
  - attack.T1552
  - attack.T1552.006
detection:
  selection_gpp:
    CommandLine|contains:
      - 'Groups.xml'
      - 'Services.xml'
      - 'Scheduledtasks.xml'
      - 'DataSources.xml'
      - 'Printers.xml'
      - 'cpassword'
      - 'Get-GPPPassword'
  selection_sysvol:
    CommandLine|contains:
      - '\SYSVOL\'
      - '\Policies\'
    CommandLine|contains|all:
      - 'cpassword'
  condition: selection_gpp or selection_sysvol
falsepositives:
  - Group Policy administration tools
  - Automated GP processing scripts
impact:
  confidentiality: high
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1552.006
