id: 9d5b7f3a-2c6e-4d8b-e4f0-1a7b5c3d9e2f
title: Regsvr32 Living-off-the-Land Binary Abuse
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.defense_evasion
  - attack.execution
  - attack.T1218
  - attack.T1218.010
detection:
  selection_scrobj:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - 'scrobj.dll'
      - '/s /u /i:'
      - '/s /i:'
  selection_remote:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
      - '\\\\'
  condition: selection_scrobj or selection_remote
falsepositives:
  - Legitimate COM component registration by enterprise software
  - ActiveX control registration during software installation
  - Development environments testing COM components
impact:
  confidentiality: medium
  integrity: high
  availability: medium
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
  - User
mitre:
  tactic: defense-evasion
  technique: T1218.010
