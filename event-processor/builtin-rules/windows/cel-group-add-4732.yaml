id: 5219
name: CEL-WIN-GROUP-ADD
dataTypes:
  - wineventlog
  - windows
  - windows-etw
category: Persistence
technique: "T1098 - Account Manipulation"
adversary: origin
description: A member was added to a security-enabled local group (Event ID 4732).
references:
  - https://attack.mitre.org/techniques/T1098/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
where: >
  (has(log.eventCode) && (log.eventCode == 4732 || string(log.eventCode) == "4732"))
  || (has(log.eventId) && (string(log.eventId) == "4732"))
  || raw.matches("(?i)(event.?id|eventcode)[^0-9]{0,12}4732")
