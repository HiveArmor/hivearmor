id: 7b3f5d1e-0a4c-4b6f-c2d8-9e5f3a1b7c0d
title: PowerShell Encoded Command Execution
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.T1059
  - attack.T1059.001
  - attack.T1027
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -enc '
      - ' -e '
      - ' -EC '
  filter_short_e:
    CommandLine|re: '.*\s-e\s+[A-Za-z].*'
  condition: selection and not filter_short_e
falsepositives:
  - Legitimate software deployment scripts using encoded commands
  - Configuration management tools like Ansible, Chef, or Puppet
  - SCCM or similar enterprise management software
impact:
  confidentiality: medium
  integrity: high
  availability: medium
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
  - User
mitre:
  tactic: execution
  technique: T1059.001
