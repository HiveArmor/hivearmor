id: e9f0a1b2-c3d4-5678-efab-789012345629
title: Control.exe Abused for Proxy Execution of Malicious CPL
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.T1218
detection:
  selection:
    Image|endswith: '\control.exe'
    CommandLine|contains:
      - '.cpl'
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - 'http://'
      - 'https://'
  condition: selection
falsepositives:
  - Legitimate Control Panel applet execution
  - System configuration changes via CPL files
impact:
  confidentiality: medium
  integrity: high
  availability: medium
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: execution
  technique: T1218
