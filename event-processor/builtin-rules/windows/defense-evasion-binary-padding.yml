id: b0c1d2e3-f4a5-6789-bcde-890123456750
title: Binary Padding to Evade Hash-Based Detection
status: stable
logsource:
  product: windows
  category: process_creation
level: medium
tags:
  - attack.defense_evasion
  - attack.T1027
  - attack.T1027.001
detection:
  selection:
    CommandLine|contains:
      - 'fsutil file setZeroData'
      - 'cipher /w:'
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
  selection_append:
    CommandLine|contains:
      - 'type nul >>'
      - 'echo.>>'
    CommandLine|contains:
      - '.exe'
      - '.dll'
  condition: selection or selection_append
falsepositives:
  - Storage management tools
  - Forensic disk wiping operations
impact:
  confidentiality: low
  integrity: high
  availability: low
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: defense-evasion
  technique: T1027.001
