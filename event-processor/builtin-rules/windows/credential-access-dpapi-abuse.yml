id: b2c3d4e5-f6a7-8901-bcde-f12345678902
title: DPAPI Master Key or Credential Blob Access
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.credential_access
  - attack.T1555
  - attack.T1555.003
detection:
  selection_dpapi:
    CommandLine|contains:
      - 'dpapi::'
      - 'masterkeys'
      - 'credman'
      - 'vault::cred'
      - 'CryptUnprotectData'
  selection_paths:
    CommandLine|contains:
      - '\Microsoft\Protect\'
      - '\AppData\Roaming\Microsoft\Credentials\'
      - '\AppData\Local\Microsoft\Credentials\'
  condition: selection_dpapi or selection_paths
falsepositives:
  - Password managers with legitimate DPAPI usage
  - Browser credential backup utilities
  - Enterprise credential management systems
impact:
  confidentiality: high
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - User
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1555.003
