id: c5d6e7f8-a9b0-1234-cdef-345678901245
title: Windows Defender Disabling via Registry or Command Line
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.defense_evasion
  - attack.T1562
  - attack.T1562.001
detection:
  selection_powershell:
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'DisableRealtimeMonitoring'
      - 'DisableBehaviorMonitoring'
      - 'DisableIOAVProtection'
      - 'DisableScriptScanning'
  selection_reg:
    CommandLine|contains:
      - 'DisableAntiSpyware'
      - 'DisableAntiVirus'
      - 'Windows Defender'
    CommandLine|contains:
      - 'reg add'
      - 'HKLM'
  condition: selection_powershell or selection_reg
falsepositives:
  - Authorized security operations modifying AV exclusions
  - Enterprise security management platforms
impact:
  confidentiality: low
  integrity: high
  availability: high
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: defense-evasion
  technique: T1562.001
