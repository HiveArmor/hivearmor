id: c9d0e1f2-a3b4-5678-cdef-789012345639
title: Time Provider DLL Modification for Persistence
status: stable
logsource:
  product: windows
  category: registry_set
level: high
tags:
  - attack.persistence
  - attack.T1547
  - attack.T1547.003
detection:
  selection:
    TargetObject|contains:
      - '\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders'
    TargetObject|endswith:
      - '\DllName'
  filter_legit:
    Details|contains:
      - 'w32time.dll'
      - 'vmictimeprovider.dll'
  condition: selection and not filter_legit
falsepositives:
  - NTP appliances registering custom time providers
  - Virtual machine tools installing time sync providers
impact:
  confidentiality: low
  integrity: high
  availability: medium
deduplicateBy:
  - ComputerName
  - TargetObject
groupBy:
  - ComputerName
mitre:
  tactic: persistence
  technique: T1547.003
