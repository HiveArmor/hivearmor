id: f6a7b8c9-d0e1-2345-fabc-456789012306
title: Browser Credential Database Access
status: stable
logsource:
  product: windows
  category: file_access
level: high
tags:
  - attack.credential_access
  - attack.T1555
  - attack.T1555.003
detection:
  selection_chrome:
    TargetFilename|contains:
      - '\Google\Chrome\User Data\Default\Login Data'
      - '\Google\Chrome\User Data\Default\Cookies'
      - '\Google\Chrome\User Data\Default\Web Data'
  selection_firefox:
    TargetFilename|contains:
      - '\Mozilla\Firefox\Profiles\'
      - '\logins.json'
      - '\key4.db'
  selection_edge:
    TargetFilename|contains:
      - '\Microsoft\Edge\User Data\Default\Login Data'
  filter_browser:
    Image|contains:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
  condition: (selection_chrome or selection_firefox or selection_edge) and not filter_browser
falsepositives:
  - Password manager browser extensions
  - Enterprise browser policy management tools
  - Legitimate backup software
impact:
  confidentiality: high
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - Image
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1555.003
