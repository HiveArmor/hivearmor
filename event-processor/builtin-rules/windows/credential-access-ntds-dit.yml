id: b8c9d0e1-f2a3-4567-bcde-678901234508
title: NTDS.dit File Access or Exfiltration
status: stable
logsource:
  product: windows
  category: process_creation
level: critical
tags:
  - attack.credential_access
  - attack.T1003
  - attack.T1003.003
detection:
  selection_direct:
    CommandLine|contains:
      - 'ntds.dit'
      - 'NTDS.dit'
      - 'ntdsutil'
  selection_shadow:
    CommandLine|contains:
      - 'vssadmin create shadow'
      - 'wbadmin start backup'
    CommandLine|contains:
      - 'ntds'
  selection_impacket:
    CommandLine|contains:
      - 'secretsdump'
      - 'GetADUsers'
  condition: selection_direct or selection_shadow or selection_impacket
falsepositives:
  - Authorized Active Directory backup tools
  - Domain controller maintenance procedures
impact:
  confidentiality: critical
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1003.003
