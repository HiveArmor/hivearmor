id: c3d4e5f6-a7b8-9012-cdef-123456789003
title: SAM Database Dump via Registry or Volume Shadow Copy
status: stable
logsource:
  product: windows
  category: process_creation
level: critical
tags:
  - attack.credential_access
  - attack.T1003
  - attack.T1003.002
detection:
  selection_reg:
    CommandLine|contains:
      - 'reg save hklm\sam'
      - 'reg save HKLM\SAM'
      - 'reg save hklm\system'
      - 'reg save HKLM\SYSTEM'
      - 'reg save hklm\security'
  selection_vss:
    CommandLine|contains:
      - '\windows\system32\config\SAM'
      - '\windows\system32\config\sam'
      - 'HarvestCredentials'
  condition: selection_reg or selection_vss
falsepositives:
  - Authorized backup software performing registry exports
  - System recovery operations
impact:
  confidentiality: critical
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1003.002
