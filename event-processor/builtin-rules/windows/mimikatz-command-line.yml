id: 8b3e2f7a-1d4c-4e5b-9a0f-6c2d8b5e1f3a
title: Mimikatz Command Line Indicators
status: stable
logsource:
  product: windows
  category: process_creation
level: critical
tags:
  - attack.credential_access
  - attack.T1003
  - attack.T1003.001
  - attack.T1003.002
detection:
  selection_cli:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'kerberos::'
      - 'lsadump::'
      - 'privilege::debug'
      - 'crypto::'
      - 'vault::'
      - 'misc::memssp'
      - 'token::elevate'
  selection_image:
    Image|endswith:
      - '\mimikatz.exe'
      - '\mimilib.dll'
  condition: selection_cli or selection_image
falsepositives:
  - Legitimate penetration testing by authorized red teams
  - Security research labs with isolated environments
impact:
  confidentiality: critical
  integrity: medium
  availability: low
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1003.001
