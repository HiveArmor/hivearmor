id: d0e1f2a3-b4c5-6789-defa-890123456710
title: Shadow Copy Deletion to Prevent Credential Recovery
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.credential_access
  - attack.impact
  - attack.T1490
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'delete shadows'
      - 'Delete Shadows'
  selection_wmic:
    CommandLine|contains:
      - 'shadowcopy delete'
      - 'ShadowCopy Delete'
      - 'Win32_ShadowCopy'
    CommandLine|contains:
      - 'delete'
  selection_powershell:
    CommandLine|contains:
      - 'Get-WmiObject Win32_Shadowcopy'
      - 'gwmi Win32_ShadowCopy'
    CommandLine|contains:
      - 'Delete()'
  condition: selection_vssadmin or selection_wmic or selection_powershell
falsepositives:
  - Legitimate system cleanup operations
  - Storage management automation scripts
impact:
  confidentiality: medium
  integrity: high
  availability: high
deduplicateBy:
  - ComputerName
  - Image
groupBy:
  - ComputerName
mitre:
  tactic: impact
  technique: T1490
