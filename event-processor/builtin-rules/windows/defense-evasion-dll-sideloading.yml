id: a3b4c5d6-e7f8-9012-abcd-123456789043
title: DLL Sideloading via Legitimate Signed Binary
status: stable
logsource:
  product: windows
  category: image_load
level: high
tags:
  - attack.defense_evasion
  - attack.T1574
  - attack.T1574.002
detection:
  selection:
    ImageLoaded|endswith: '.dll'
    ImageLoaded|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
  filter_signed:
    Signed: 'true'
    ImageLoaded|contains:
      - 'C:\Windows\'
      - 'C:\Program Files\'
  condition: selection and not filter_signed
falsepositives:
  - Legitimate applications loading DLLs from user directories
  - Developer builds with custom DLL paths
impact:
  confidentiality: medium
  integrity: high
  availability: medium
deduplicateBy:
  - ComputerName
  - ImageLoaded
groupBy:
  - ComputerName
mitre:
  tactic: defense-evasion
  technique: T1574.002
