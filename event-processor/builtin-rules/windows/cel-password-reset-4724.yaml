id: 5253
name: CEL-WIN-PASSWORD-RESET
dataTypes:
  - wineventlog
  - windows
  - windows-etw
category: Persistence
technique: "T1098 - Account Manipulation"
adversary: origin
description: Attempt to reset an account password (Event ID 4724).
references:
  - https://attack.mitre.org/techniques/T1098/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
where: >
  (has(log.eventCode) && (log.eventCode == 4724 || string(log.eventCode) == "4724"))
  || (has(log.eventId) && (string(log.eventId) == "4724"))
  || raw.matches("(?i)(event.?id|eventcode)[^0-9]{0,12}4724")
