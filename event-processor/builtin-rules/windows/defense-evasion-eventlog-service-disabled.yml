id: f8a9b0c1-d2e3-4567-fabc-678901234548
title: Windows Event Log Service Disabled or Stopped
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.defense_evasion
  - attack.T1070
  - attack.T1562
  - attack.T1562.002
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - 'EventLog'
      - 'eventlog'
    CommandLine|contains:
      - 'stop'
      - 'delete'
      - 'config'
  selection_registry:
    TargetObject|contains:
      - '\SYSTEM\CurrentControlSet\Services\EventLog'
    TargetObject|endswith: '\Start'
    Details: '4'
  condition: selection_sc or selection_registry
falsepositives:
  - Authorized system administrators stopping event log for maintenance
  - Legacy audit configurations
impact:
  confidentiality: low
  integrity: high
  availability: high
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: defense-evasion
  technique: T1562.002
