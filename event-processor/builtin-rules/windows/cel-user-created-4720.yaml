id: 5218
name: CEL-WIN-USER-CREATED
dataTypes:
  - wineventlog
  - windows
  - windows-etw
category: Persistence
technique: "T1136.001 - Create Account: Local Account"
adversary: origin
description: A local user account was created (Event ID 4720).
references:
  - https://attack.mitre.org/techniques/T1136/001/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 2
  integrity: 3
  availability: 1
where: >
  (has(log.eventCode) && (log.eventCode == 4720 || string(log.eventCode) == "4720"))
  || (has(log.eventId) && (string(log.eventId) == "4720"))
  || raw.matches("(?i)(event.?id|eventcode)[^0-9]{0,12}4720")
