id: 5204
name: CEL-WIN-CLEAR-EVENTLOG
dataTypes:
  - wineventlog
  - windows
  - windows-etw
category: Defense Evasion
technique: "T1070.001 - Indicator Removal: Clear Windows Event Logs"
adversary: origin
description: Windows Security audit log cleared (Event ID 1102).
references:
  - https://attack.mitre.org/techniques/T1070/001/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 2
  integrity: 3
  availability: 1
where: >
  (has(log.eventCode) && (log.eventCode == 1102 || string(log.eventCode) == "1102"))
  || (has(log.eventId) && (string(log.eventId) == "1102"))
  || raw.matches("(?i)(event.?id|eventcode)[^0-9]{0,12}1102")
