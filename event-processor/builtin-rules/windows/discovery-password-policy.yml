id: f0a1b2c3-d4e5-6789-fabc-890123456760
title: Password Policy Discovery via Net or PowerShell
status: stable
logsource:
  product: windows
  category: process_creation
level: medium
tags:
  - attack.discovery
  - attack.T1201
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - ' accounts'
      - ' accounts /domain'
  selection_powershell:
    CommandLine|contains:
      - 'Get-ADDefaultDomainPasswordPolicy'
      - 'Get-ADFineGrainedPasswordPolicy'
      - 'net accounts'
  selection_secedit:
    Image|endswith: '\secedit.exe'
    CommandLine|contains:
      - '/export'
      - 'secpol'
  condition: selection_net or selection_powershell or selection_secedit
falsepositives:
  - Security auditors reviewing password policy
  - Compliance checking tools
  - IT administrators reviewing domain settings
impact:
  confidentiality: medium
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - CommandLine
groupBy:
  - ComputerName
mitre:
  tactic: discovery
  technique: T1201
