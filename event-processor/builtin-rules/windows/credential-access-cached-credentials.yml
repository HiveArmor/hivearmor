id: c9d0e1f2-a3b4-5678-cdef-789012345609
title: Cached Domain Credential Abuse via Registry
status: stable
logsource:
  product: windows
  category: registry_event
level: medium
tags:
  - attack.credential_access
  - attack.T1003
  - attack.T1003.005
detection:
  selection:
    TargetObject|contains:
      - 'HKLM\Security\Cache'
      - 'HKLM\SECURITY\Cache'
      - 'NL$'
  filter_system:
    Image|contains:
      - 'C:\Windows\System32\lsass.exe'
  condition: selection and not filter_system
falsepositives:
  - Security tools performing credential audits
  - Domain controller audit operations
impact:
  confidentiality: high
  integrity: low
  availability: low
deduplicateBy:
  - ComputerName
  - Image
groupBy:
  - ComputerName
mitre:
  tactic: credential-access
  technique: T1003.005
