id: e1f2a3b4-c5d6-7890-efab-901234567841
title: Timestomping via SetFileTime or File Attribute Modification
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.defense_evasion
  - attack.T1070
  - attack.T1070.006
detection:
  selection_tools:
    Image|endswith:
      - '\timestomp.exe'
      - '\SetMACE.exe'
    CommandLine|contains:
      - '-m '
      - '-a '
      - '-c '
  selection_powershell:
    CommandLine|contains:
      - 'LastWriteTime'
      - 'CreationTime'
      - 'LastAccessTime'
      - '.SetLastWriteTime'
      - '.SetCreationTime'
  condition: selection_tools or selection_powershell
falsepositives:
  - File synchronization software correcting timestamps
  - Backup software restoring original timestamps
impact:
  confidentiality: low
  integrity: high
  availability: low
deduplicateBy:
  - ComputerName
  - Image
groupBy:
  - ComputerName
mitre:
  tactic: defense-evasion
  technique: T1070.006
