id: 5205
name: CEL-WIN-EXPLICIT-CREDS
dataTypes:
  - wineventlog
  - windows
  - windows-etw
category: Lateral Movement
technique: "T1550.002 - Use Alternate Authentication Material: Pass the Hash"
adversary: origin
description: Explicit credentials were used (Event ID 4648).
references:
  - https://attack.mitre.org/techniques/T1550/002/
deduplicateBy:
  - origin.host
  - origin.user
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
where: >
  (has(log.eventCode) && (log.eventCode == 4648 || string(log.eventCode) == "4648"))
  || (has(log.eventId) && (string(log.eventId) == "4648"))
  || raw.matches("(?i)(event.?id|eventcode)[^0-9]{0,12}4648")
