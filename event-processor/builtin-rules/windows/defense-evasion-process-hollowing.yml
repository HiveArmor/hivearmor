id: f2a3b4c5-d6e7-8901-fabc-012345678942
title: Process Hollowing via Suspicious Memory Operations
status: stable
logsource:
  product: windows
  category: process_creation
level: high
tags:
  - attack.defense_evasion
  - attack.T1055
  - attack.T1055.012
detection:
  selection:
    Image|endswith:
      - '\svchost.exe'
      - '\explorer.exe'
      - '\notepad.exe'
      - '\msiexec.exe'
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  filter_legit_parent:
    ParentImage|contains:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
  condition: selection and not filter_legit_parent
falsepositives:
  - Scripted system administration
  - Software updaters launching system processes
impact:
  confidentiality: medium
  integrity: high
  availability: medium
deduplicateBy:
  - ComputerName
  - Image
  - ParentImage
groupBy:
  - ComputerName
mitre:
  tactic: defense-evasion
  technique: T1055.012
