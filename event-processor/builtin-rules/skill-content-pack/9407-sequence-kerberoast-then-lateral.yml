id: 9407
name: SEQ-KERBEROAST-THEN-LATERAL
dataTypes:
  - windows
  - wineventlog
  - network
category: Lateral Movement
technique: "T1558.003 - Steal or Forge Kerberos Tickets: Kerberoasting"
mitre:
  tactics: ["TA0006", "TA0008"]
  attacks: ["T1558.003", "T1021"]
adversary: origin
description: >
  Skill content pack. Sequence: a Kerberoast-style TGS request (RC4/weak
  encryption, GetUserSPNs, or Event 4769 TicketEncryptionType 0x17) is
  followed by a remote service logon from the same origin user or host
  within 45 minutes. That pairing is the harvest-then-pivot pattern, not
  a lone 4769. False positives: service-account monitoring tools that
  request many TGS tickets, and subsequent admin RDP. Group by user.
references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://attack.mitre.org/techniques/T1021/
  - https://adsecurity.org/?p=3458
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
deduplicateBy:
  - origin.user
  - origin.host
groupBy:
  - origin.user
  - origin.host
sequence:
  - where: 'action == "kerberoast" || safe("log.action", "") == "kerberoast" || raw.matches("(?i).*(GetUserSPNs(\\.py)?|TicketEncryptionType.{0,8}0x17|kerberoast).*")'
    within: 15m
  - where: 'action == "remote_logon" || safe("log.action", "") == "remote_logon" || raw.matches("(?i).*(LogonType.{0,4}(3|10)|winrs|Enter-PSSession|admin\\$).*")'
    within: 45m
afterEvents:
  - indexPattern: v3-hive-log-*
    with:
      - field: origin.user
        operator: filter_term
        value: "{{.origin.user}}"
      - field: log.action
        operator: filter_term
        value: kerberoast
    within: 45m
    count: 1
