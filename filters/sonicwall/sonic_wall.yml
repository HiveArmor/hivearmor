# SonicWall Firewall parser, version 4.0.0 (rebuilt)
# Native SonicWall syslog is a key=value stream (id= sn= time= fw= pri= c= m= msg= src= dst=
# proto= fw_action= ...); the appliance can also export CEF. This parser handles BOTH.
#
# References:
#   https://www.sonicwall.com/techdocs (SonicOS Log Events Reference Guide)
#   https://docs.cyderes.cloud/parser-knowledge-base/sonicwall/ (KV sample)
#   https://docs.sophos.com/.../SonicWall/ (native KV field notes)
#
# Design notes (why this differs from the previous version):
# - Grok field_names are BARE (not 'log.x'): GrokOp writes logMap[field_name], and rule CEL
#   'log.eventName' resolves event.Log["eventName"] — so a 'log.' prefix would mis-key.
# - CEF header separators use a plain '|' (patternToRegex QuoteMeta-escapes it correctly;
#   '\|' would compile to a literal backslash+pipe and never match).
# - The kv step sets source: log.body and now (post kv-source fix) actually parses that
#   isolated body, not the whole raw line.
# - Every conditional grok/kv is guarded by a `where` so blocks don't mangle unrelated events.
#
# Rule contract (fields the shipped SonicWall rules read as log.<x>):
#   message eventName category msg result ipspri ipscat fw_action spypri spycat severity
#   gcat dpi app af_type af_service action

pipeline:
  - dataTypes:
      - firewall-sonicwall
    steps:

      # ── Phase 1: strip the syslog PRI + header, isolate the body ───────────
      # Handles "<134>", optional syslog version, an RFC3164 or ISO timestamp, and host.
      # Everything from the first "id=" (KV) or "CEF:" (CEF) onward is the body.
      - grok:
          patterns:
            - field_name: body
              pattern: 'id={{.greedy}}'
          source: raw
          where: contains("raw", "id=")

      - grok:
          patterns:
            - field_name: body
              pattern: 'CEF:{{.greedy}}'
          source: raw
          where: contains("raw", "CEF:") && !contains("raw", "id=")

      # If neither marker was found, fall back to the raw line as the body.
      - add:
          function: set
          params:
            key: log.body
            value: '{{.raw}}'
          where: '!contains("raw", "id=") && !contains("raw", "CEF:")'

      # ── Phase 2 (CEF branch): split the CEF header off the body ────────────
      # Body here is "CEF:0|Vendor|Product|Version|SignatureID|Name|Severity|Extension"
      # (we grokked from "CEF:" so re-add the marker handling with the leading CEF:).
      - grok:
          patterns:
            - field_name: cefVersion
              pattern: '{{.integer}}|'
            - field_name: dvcVendor
              pattern: '{{.data}}|'
            - field_name: dvcProduct
              pattern: '{{.data}}|'
            - field_name: dvcVersion
              pattern: '{{.data}}|'
            - field_name: eventId
              pattern: '{{.data}}|'
            - field_name: eventName
              pattern: '{{.data}}|'
            - field_name: severity
              pattern: '{{.integer}}|'
            - field_name: cefExtension
              pattern: '{{.greedy}}'
          source: log.body
          where: contains("log.body", "CEF:") || contains("raw", "CEF:")

      # ── Phase 4: kv the remaining single-token key=value pairs from the body
      # For CEF, the extension is single-token key=value (spaced values handled above);
      # for native KV, the body is the key=value stream. kv now honors this source.
      - kv:
          fieldSplit: ' '
          valueSplit: '='
          source: log.cefExtension
          where: exists("log.cefExtension")

      - kv:
          fieldSplit: ' '
          valueSplit: '='
          source: log.body
          where: '!exists("log.cefExtension")'

      # ── Phase 4b: overwrite kv-truncated quoted values with precise grok ──
      # SonicWall quotes spaced values: msg="..." ipscat="..." Category="..." note="..."
      # Grok each up to its closing quote so kv (space-split) does not truncate them.
      - grok:
          patterns:
            - field_name: message
              pattern: 'msg="{{.data}}"'
          source: log.body
          where: contains("log.body", "msg=\"")

      - grok:
          patterns:
            - field_name: ipscat
              pattern: 'ipscat="{{.data}}"'
          source: log.body
          where: contains("log.body", "ipscat=\"")

      - grok:
          patterns:
            - field_name: spycat
              pattern: 'spycat="{{.data}}"'
          source: log.body
          where: contains("log.body", "spycat=\"")

      - grok:
          patterns:
            - field_name: category
              pattern: 'Category="{{.data}}"'
          source: log.body
          where: contains("log.body", "Category=\"")

      - grok:
          patterns:
            - field_name: fw_action_q
              pattern: 'fw_action="{{.data}}"'
          source: log.body
          where: contains("log.body", "fw_action=\"")

      # ── Phase 5: normalize compound + schema fields ────────────────────────
      # SonicWall src/dst are "ip:port:interface" — take the leading IP for origin/target.
      - grok:
          patterns:
            - field_name: srcIp
              pattern: '{{.ipv4}}'
          source: log.src
          where: exists("log.src")

      - grok:
          patterns:
            - field_name: dstIp
              pattern: '{{.ipv4}}'
          source: log.dst
          where: exists("log.dst")

      - rename:
          from:
            - log.srcIp
          to: origin.ip
          where: exists("log.srcIp")

      - rename:
          from:
            - log.dstIp
          to: target.ip
          where: exists("log.dstIp")

      - rename:
          from:
            - log.dstname
          to: target.host
          where: exists("log.dstname")

      - rename:
          from:
            - log.proto
          to: protocol
          where: exists("log.proto")

      # SonicWall's fw_action IS the action verb; rules read it as log.fw_action.
      # (AddOp does not interpolate {{.}}, and rename would drop log.fw_action, so we keep
      #  the field as-is rather than duplicating it into event.Action.)
      - rename:
          from:
            - log.fw_action_q
          to: log.fw_action
          where: exists("log.fw_action_q")

      # ── Phase 6: dataType + category ───────────────────────────────────────
      - add:
          function: set
          params:
            key: log.dataType
            value: firewall-sonicwall

      - add:
          function: set
          params:
            key: log.eventCategory
            value: threat
