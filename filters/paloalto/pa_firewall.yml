# Palo Alto Networks Firewall parser, version 4.0.0 (rebuild)
# dataType: firewall-paloalto
#
# Scope of this build: the THREAT log family (subtypes spyware, vulnerability,
# wildfire, url, dns, exploit, ...). Handles the two real PAN-OS THREAT formats:
#
#   1. Strata Logging Service CEF (syslog-wrapped):
#      ... logforwarder - panwlogs - CEF:0|Palo Alto Networks|LF|2.0|THREAT|spyware|1|<ext>
#      where <ext> is space-separated key=value pairs (src=, dst=, act=, PanOSSeverity=,
#      PanOSThreatID=, PanOSThreatCategory=, cat=, ...).
#
#   2. Classic PAN-OS syslog CSV (Threat Log Fields field order):
#      FUTURE_USE,ReceiveTime,Serial,THREAT,<subtype>,FUTURE_USE,GenTime,SrcAddr,DstAddr,
#      NATsrc,NATdst,Rule,SrcUser,DstUser,App,Vsys,SrcZone,DstZone,InIf,OutIf,LogAction,
#      FUTURE_USE,SessionID,RepeatCnt,SrcPort,DstPort,NATsport,NATdport,Flags,Proto,
#      Action,URL/Filename,ThreatID,Category,Severity,Direction,...
#
# References:
#   https://docs.paloaltonetworks.com/strata-logging-service/log-reference/network-logs/network-threat-log/network-threat-cef-fields
#   https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/threat-log-fields
#
# Rule contract emitted (read by rules/paloalto/pa_firewall/*.yml as log.<x>):
#   pa_type, pa_subtype, severityLabel, act, pa_threatid, category, urlCategory, message
#   origin.ip/adversary.ip, target.ip, target.host

pipeline:
  - dataTypes:
      - firewall-paloalto
    steps:

      # ═══════════════════════════════════════════════════════════════════════
      # CEF PATH
      # ═══════════════════════════════════════════════════════════════════════

      # ── Isolate the CEF payload from the syslog wrapper ──────────────────────
      # Everything up to and including "CEF:" is dropped; cefMsgAll holds
      # "0|Palo Alto Networks|LF|2.0|THREAT|spyware|1|<ext>".
      - grok:
          patterns:
            - field_name: cefPrefix
              pattern: '{{.data}}CEF:'
            - field_name: cefMsgAll
              pattern: '{{.greedy}}'
          source: raw
          where: contains("raw", "CEF:")

      # ── Parse the CEF header (plain pipe, bare names) ────────────────────────
      # cefVersion|vendor|product|productVersion|pa_type|pa_subtype|cefSeverity|cefExtension
      - grok:
          patterns:
            - field_name: cefVersion
              pattern: '{{.data}}|'
            - field_name: vendor
              pattern: '{{.data}}|'
            - field_name: product
              pattern: '{{.data}}|'
            - field_name: productVersion
              pattern: '{{.data}}|'
            - field_name: pa_type
              pattern: '{{.data}}|'
            - field_name: pa_subtype
              pattern: '{{.data}}|'
            - field_name: cefSeverity
              pattern: '{{.data}}|'
            - field_name: cefExtension
              pattern: '{{.greedy}}'
          source: log.cefMsgAll
          where: contains("log.cefMsgAll", "|")

      - trim:
          function: suffix
          substring: '|'
          fields:
            - log.cefVersion
            - log.vendor
            - log.product
            - log.productVersion
            - log.pa_type
            - log.pa_subtype
            - log.cefSeverity

      # ── Space-valued CEF fields, captured BEFORE kv so kv can't truncate ─────
      # request=<file/url, may contain spaces> ... next key= OR end-of-line.
      - grok:
          patterns:
            - field_name: reqTrash
              pattern: '{{.data}}request='
            - field_name: pa_request
              pattern: '{{.data}} {{.word}}='
            - field_name: reqTrash2
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "request=")
      - grok:
          patterns:
            - field_name: reqTrash3
              pattern: '{{.data}}request='
            - field_name: pa_requestEol
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "request=")

      # cat=<threat name, may contain spaces> ... next key= (mid-line)
      - grok:
          patterns:
            - field_name: catTrash
              pattern: '{{.data}}cat='
            - field_name: pa_catName
              pattern: '{{.data}} {{.word}}='
            - field_name: catTrash2
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "cat=")

      # ── kv the CEF extension (space/=), reading the isolated extension only ──
      - kv:
          fieldSplit: ' '
          valueSplit: '='
          source: log.cefExtension
          where: contains("log.cefExtension", "=")

      # ── CEF field promotions to the rule contract ───────────────────────────
      # PanOSSeverity carries the human severity label in CEF (e.g. "high").
      - rename:
          from:
            - log.PanOSSeverity
          to: log.severityLabel
          where: exists("log.PanOSSeverity")
      # PanOSThreatID -> pa_threatid (e.g. "27379(27379)" or a CVE string)
      - rename:
          from:
            - log.PanOSThreatID
          to: log.pa_threatid
          where: exists("log.PanOSThreatID")
      # PanOSThreatCategory -> category (e.g. "spyware", "unknown")
      - rename:
          from:
            - log.PanOSThreatCategory
          to: log.category
          where: exists("log.PanOSThreatCategory")
      # Prefer the boundary-captured threat name (cat=) as message when present.
      - rename:
          from:
            - log.pa_catName
          to: log.message
          where: exists("log.pa_catName")

      # ═══════════════════════════════════════════════════════════════════════
      # CSV PATH  (no "CEF:" marker, comma-separated, field 4 == THREAT)
      # ═══════════════════════════════════════════════════════════════════════
      # Positional grok over the documented Threat field order. {{.data}} is
      # non-greedy so each ',' boundary is respected. We stop capturing after
      # the Severity field (field 35) which is the deepest field any rule reads.
      - grok:
          patterns:
            - field_name: csvFutureUse
              pattern: '{{.csv}},'
            - field_name: csvReceiveTime
              pattern: '{{.csv}},'
            - field_name: csvSerial
              pattern: '{{.csv}},'
            - field_name: pa_type
              pattern: '{{.csv}},'
            - field_name: pa_subtype
              pattern: '{{.csv}},'
            - field_name: csvFutureUse2
              pattern: '{{.csv}},'
            - field_name: csvGenTime
              pattern: '{{.csv}},'
            - field_name: src
              pattern: '{{.csv}},'
            - field_name: dst
              pattern: '{{.csv}},'
            - field_name: csvNatSrc
              pattern: '{{.csv}},'
            - field_name: csvNatDst
              pattern: '{{.csv}},'
            - field_name: csvRule
              pattern: '{{.csv}},'
            - field_name: csvSrcUser
              pattern: '{{.csv}},'
            - field_name: csvDstUser
              pattern: '{{.csv}},'
            - field_name: csvApp
              pattern: '{{.csv}},'
            - field_name: csvVsys
              pattern: '{{.csv}},'
            - field_name: csvSrcZone
              pattern: '{{.csv}},'
            - field_name: csvDstZone
              pattern: '{{.csv}},'
            - field_name: csvInIf
              pattern: '{{.csv}},'
            - field_name: csvOutIf
              pattern: '{{.csv}},'
            - field_name: csvLogAction
              pattern: '{{.csv}},'
            - field_name: csvFutureUse3
              pattern: '{{.csv}},'
            - field_name: csvSessionId
              pattern: '{{.csv}},'
            - field_name: csvRepeatCnt
              pattern: '{{.csv}},'
            - field_name: csvSrcPort
              pattern: '{{.csv}},'
            - field_name: csvDstPort
              pattern: '{{.csv}},'
            - field_name: csvNatSport
              pattern: '{{.csv}},'
            - field_name: csvNatDport
              pattern: '{{.csv}},'
            - field_name: csvFlags
              pattern: '{{.csv}},'
            - field_name: csvProto
              pattern: '{{.csv}},'
            - field_name: act
              pattern: '{{.csv}},'
            - field_name: csvUrlFilename
              pattern: '{{.csv}},'
            - field_name: pa_threatid
              pattern: '{{.csv}},'
            - field_name: category
              pattern: '{{.csv}},'
            - field_name: severityLabel
              pattern: '{{.csv}},'
          source: raw
          where: contains("raw", "THREAT") && !contains("raw", "CEF:")

      # For the url subtype, the Category field is the URL category.
      - add:
          function: set
          params:
            key: log.urlCategory
            value: '{{.log.category}}'
          where: equals("log.pa_subtype", "url") && exists("log.category")

      # ═══════════════════════════════════════════════════════════════════════
      # SHARED NORMALIZATION
      # ═══════════════════════════════════════════════════════════════════════

      # severityLabel is lowercased so it matches the rule contract
      # (rules test oneOf ["critical","high"]; CEF sends "High"/"Informational").
      - cast:
          fields:
            - log.severityLabel
          to: lower
          where: exists("log.severityLabel")

      - rename:
          from:
            - log.src
          to: origin.ip
          where: exists("log.src")
      - rename:
          from:
            - log.dst
          to: target.ip
          where: exists("log.dst")
      - rename:
          from:
            - log.duser
          to: target.user
          where: exists("log.duser")
      - rename:
          from:
            - log.suser
          to: origin.user
          where: exists("log.suser")
      - rename:
          from:
            - log.proto
          to: protocol
          where: exists("log.proto")

      # Geolocation enrichment
      - dynamic:
          plugin: com.hivearmor.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      - dynamic:
          plugin: com.hivearmor.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      - add:
          function: set
          params:
            key: log.dataType
            value: firewall-paloalto

      # ── Cleanup scratch fields ───────────────────────────────────────────────
      - delete:
          fields:
            - log.cefPrefix
            - log.cefMsgAll
            - log.cefExtension
            - log.reqTrash
            - log.reqTrash2
            - log.reqTrash3
            - log.catTrash
            - log.catTrash2
            - log.csvFutureUse
            - log.csvFutureUse2
            - log.csvFutureUse3
