# Palo Alto Networks Firewall parser, version 4.0.0 (rebuild)
# dataType: firewall-paloalto
#
# Scope of this build: the THREAT log family (subtypes spyware, vulnerability,
# wildfire, url, dns, exploit, ...). Handles the two real PAN-OS THREAT formats:
#
#   1. Strata Logging Service CEF (syslog-wrapped):
#      ... logforwarder - panwlogs - CEF:0|Palo Alto Networks|LF|2.0|THREAT|spyware|1|<ext>
#      where <ext> is space-separated key=value pairs (src=, dst=, act=, PanOSSeverity=,
#      PanOSThreatID=, PanOSThreatCategory=, cat=, ...).
#
#   2. Classic PAN-OS syslog CSV (Threat Log Fields field order):
#      FUTURE_USE,ReceiveTime,Serial,THREAT,<subtype>,FUTURE_USE,GenTime,SrcAddr,DstAddr,
#      NATsrc,NATdst,Rule,SrcUser,DstUser,App,Vsys,SrcZone,DstZone,InIf,OutIf,LogAction,
#      FUTURE_USE,SessionID,RepeatCnt,SrcPort,DstPort,NATsport,NATdport,Flags,Proto,
#      Action,URL/Filename,ThreatID,Category,Severity,Direction,...
#
# References:
#   https://docs.paloaltonetworks.com/strata-logging-service/log-reference/network-logs/network-threat-log/network-threat-cef-fields
#   https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/threat-log-fields
#
# Rule contract emitted (read by rules/paloalto/pa_firewall/*.yml as log.<x>):
#   pa_type, pa_subtype, severityLabel, act, pa_threatid, category, urlCategory, message
#   origin.ip/adversary.ip, target.ip, target.host

pipeline:
  - dataTypes:
      - firewall-paloalto
    steps:

      # ═══════════════════════════════════════════════════════════════════════
      # CEF PATH
      # ═══════════════════════════════════════════════════════════════════════

      # ── Isolate the CEF payload from the syslog wrapper ──────────────────────
      # Everything up to and including "CEF:" is dropped; cefMsgAll holds
      # "0|Palo Alto Networks|LF|2.0|THREAT|spyware|1|<ext>".
      - grok:
          patterns:
            - field_name: cefPrefix
              pattern: '{{.data}}CEF:'
            - field_name: cefMsgAll
              pattern: '{{.greedy}}'
          source: raw
          where: contains("raw", "CEF:")

      # ── Parse the CEF header (plain pipe, bare names) ────────────────────────
      # cefVersion|vendor|product|productVersion|pa_type|pa_subtype|cefSeverity|cefExtension
      - grok:
          patterns:
            - field_name: cefVersion
              pattern: '{{.data}}|'
            - field_name: vendor
              pattern: '{{.data}}|'
            - field_name: product
              pattern: '{{.data}}|'
            - field_name: productVersion
              pattern: '{{.data}}|'
            - field_name: pa_type
              pattern: '{{.data}}|'
            - field_name: pa_subtype
              pattern: '{{.data}}|'
            - field_name: cefSeverity
              pattern: '{{.data}}|'
            - field_name: cefExtension
              pattern: '{{.greedy}}'
          source: log.cefMsgAll
          where: contains("log.cefMsgAll", "|")

      - trim:
          function: suffix
          substring: '|'
          fields:
            - log.cefVersion
            - log.vendor
            - log.product
            - log.productVersion
            - log.pa_type
            - log.pa_subtype
            - log.cefSeverity

      # ── Space-valued CEF fields, captured BEFORE kv so kv can't truncate ─────
      # request=<file/url, may contain spaces> ... next key= OR end-of-line.
      - grok:
          patterns:
            - field_name: reqTrash
              pattern: '{{.rest}}request='
            - field_name: pa_request
              pattern: '{{.data}} {{.word}}='
            - field_name: reqTrash2
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "request=")
      - grok:
          patterns:
            - field_name: reqTrash3
              pattern: '{{.rest}}request='
            - field_name: pa_requestEol
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "request=")

      # cat=<threat name, may contain spaces> ... next key= (mid-line)
      - grok:
          patterns:
            - field_name: catTrash
              pattern: '{{.rest}}cat='
            - field_name: pa_catName
              pattern: '{{.data}} {{.word}}='
            - field_name: catTrash2
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "cat=")

      # msg=<human text, may contain spaces> ... next key= (mid-line) OR end-of-line.
      - grok:
          patterns:
            - field_name: msgTrash
              pattern: '{{.rest}}msg='
            - field_name: pa_msgText
              pattern: '{{.data}} {{.word}}='
            - field_name: msgTrash2
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "msg=")
      - grok:
          patterns:
            - field_name: msgTrash3
              pattern: '{{.rest}}msg='
            - field_name: pa_msgTextEol
              pattern: '{{.greedy}}'
          source: log.cefExtension
          where: contains("log.cefExtension", "msg=")

      # ── kv the CEF extension (space/=), reading the isolated extension only ──
      - kv:
          fieldSplit: ' '
          valueSplit: '='
          source: log.cefExtension
          where: contains("log.cefExtension", "=")

      # ── CEF field promotions to the rule contract ───────────────────────────
      # PanOSSeverity carries the human severity label in CEF (e.g. "high").
      - rename:
          from:
            - log.PanOSSeverity
          to: log.severityLabel
          where: exists("log.PanOSSeverity")
      # PanOSThreatID -> pa_threatid (e.g. "27379(27379)" or a CVE string)
      - rename:
          from:
            - log.PanOSThreatID
          to: log.pa_threatid
          where: exists("log.PanOSThreatID")
      # PanOSThreatCategory -> category (e.g. "spyware", "unknown")
      - rename:
          from:
            - log.PanOSThreatCategory
          to: log.category
          where: exists("log.PanOSThreatCategory")
      # Prefer the boundary-captured threat name (cat=) as message when present.
      - rename:
          from:
            - log.pa_catName
          to: log.message
          where: exists("log.pa_catName")

      # SYSTEM (and other) CEF logs carry their human text in msg=; prefer the
      # boundary-captured value (mid-line, then end-of-line) so a space-valued
      # message is not truncated by kv. Only set when a threat name (cat=) did
      # not already populate message.
      - rename:
          from:
            - log.pa_msgText
          to: log.message
          where: exists("log.pa_msgText") && !exists("log.message")
      - rename:
          from:
            - log.pa_msgTextEol
          to: log.message
          where: exists("log.pa_msgTextEol") && !exists("log.message")
      # PanOSEventID -> panOSEventID (SYSTEM rules group by log.panOSEventID).
      - rename:
          from:
            - log.PanOSEventID
          to: log.panOSEventID
          where: exists("log.PanOSEventID")
      # PanOSEventStatus -> panOSEventStatus (GLOBALPROTECT rules test it for fail/error/denied).
      - rename:
          from:
            - log.PanOSEventStatus
          to: log.panOSEventStatus
          where: exists("log.PanOSEventStatus")

      # ═══════════════════════════════════════════════════════════════════════
      # CSV PATH  (no "CEF:" marker, comma-separated, field 4 == THREAT)
      # ═══════════════════════════════════════════════════════════════════════
      # Positional grok over the documented Threat field order. {{.data}} is
      # non-greedy so each ',' boundary is respected. We stop capturing after
      # the Severity field (field 35) which is the deepest field any rule reads.
      - grok:
          patterns:
            - field_name: csvFutureUse
              pattern: '{{.csv}},'
            - field_name: csvReceiveTime
              pattern: '{{.csv}},'
            - field_name: csvSerial
              pattern: '{{.csv}},'
            - field_name: pa_type
              pattern: '{{.csv}},'
            - field_name: pa_subtype
              pattern: '{{.csv}},'
            - field_name: csvFutureUse2
              pattern: '{{.csv}},'
            - field_name: csvGenTime
              pattern: '{{.csv}},'
            - field_name: src
              pattern: '{{.csv}},'
            - field_name: dst
              pattern: '{{.csv}},'
            - field_name: csvNatSrc
              pattern: '{{.csv}},'
            - field_name: csvNatDst
              pattern: '{{.csv}},'
            - field_name: csvRule
              pattern: '{{.csv}},'
            - field_name: csvSrcUser
              pattern: '{{.csv}},'
            - field_name: csvDstUser
              pattern: '{{.csv}},'
            - field_name: csvApp
              pattern: '{{.csv}},'
            - field_name: csvVsys
              pattern: '{{.csv}},'
            - field_name: csvSrcZone
              pattern: '{{.csv}},'
            - field_name: csvDstZone
              pattern: '{{.csv}},'
            - field_name: csvInIf
              pattern: '{{.csv}},'
            - field_name: csvOutIf
              pattern: '{{.csv}},'
            - field_name: csvLogAction
              pattern: '{{.csv}},'
            - field_name: csvFutureUse3
              pattern: '{{.csv}},'
            - field_name: csvSessionId
              pattern: '{{.csv}},'
            - field_name: csvRepeatCnt
              pattern: '{{.csv}},'
            - field_name: csvSrcPort
              pattern: '{{.csv}},'
            - field_name: csvDstPort
              pattern: '{{.csv}},'
            - field_name: csvNatSport
              pattern: '{{.csv}},'
            - field_name: csvNatDport
              pattern: '{{.csv}},'
            - field_name: csvFlags
              pattern: '{{.csv}},'
            - field_name: csvProto
              pattern: '{{.csv}},'
            - field_name: act
              pattern: '{{.csv}},'
            - field_name: csvUrlFilename
              pattern: '{{.csv}},'
            - field_name: pa_threatid
              pattern: '{{.csv}},'
            - field_name: category
              pattern: '{{.csv}},'
            - field_name: severityLabel
              pattern: '{{.csv}},'
          source: raw
          where: contains("raw", "THREAT") && !contains("raw", "CEF:")

      # For the url subtype the CSV Category field IS the URL category. It is
      # already emitted as log.category (which the url rule matches via
      # contains("log.category", ...)); we do not also copy it to
      # log.urlCategory because the add/set operator stores its value
      # literally (no {{...}} interpolation), which would emit a bogus
      # template string. log.urlCategory is reserved for the CEF
      # url_category_list field handled in a later increment.

      # ═══════════════════════════════════════════════════════════════════════
      # SYSTEM CSV PATH  (no "CEF:" marker, comma-separated, field 4 == SYSTEM)
      # ═══════════════════════════════════════════════════════════════════════
      # System Log Fields order:
      # FUTURE_USE, Receive Time, Serial, Type(SYSTEM), Subtype, FUTURE_USE,
      # Generated Time, Virtual System, Event ID, Object, FUTURE_USE, FUTURE_USE,
      # Module, Severity, Description, Sequence Number, ...
      # The Description (field 15) is the load-bearing text the SYSTEM rules
      # match on, so we capture through it. {{.csv}} tolerates empty columns.
      - grok:
          patterns:
            - field_name: sysFutureUse
              pattern: '{{.csv}},'
            - field_name: sysReceiveTime
              pattern: '{{.csv}},'
            - field_name: sysSerial
              pattern: '{{.csv}},'
            - field_name: pa_type
              pattern: '{{.csv}},'
            - field_name: pa_subtype
              pattern: '{{.csv}},'
            - field_name: sysFutureUse2
              pattern: '{{.csv}},'
            - field_name: sysGenTime
              pattern: '{{.csv}},'
            - field_name: sysVsys
              pattern: '{{.csv}},'
            - field_name: panOSEventID
              pattern: '{{.csv}},'
            - field_name: sysObject
              pattern: '{{.csv}},'
            - field_name: sysFutureUse3
              pattern: '{{.csv}},'
            - field_name: sysFutureUse4
              pattern: '{{.csv}},'
            - field_name: sysModule
              pattern: '{{.csv}},'
            - field_name: severityLabel
              pattern: '{{.csv}},'
            - field_name: message
              pattern: '{{.data}},'
          source: raw
          where: contains("raw", "SYSTEM") && !contains("raw", "CEF:")

      # ═══════════════════════════════════════════════════════════════════════
      # GLOBALPROTECT CSV PATH  (no "CEF:" marker, field 4 == GLOBALPROTECT)
      # ═══════════════════════════════════════════════════════════════════════
      # GlobalProtect Log Fields order. Fields the GP rule needs: Public IP(16)
      # -> origin.ip, Description(28) -> message, Status(29) -> panOSEventStatus,
      # Portal(34) -> target.host. {{.csv}} tolerates empty columns; the last
      # captured field (Portal) uses a trailing comma bound.
      - grok:
          patterns:
            - field_name: gpFutureUse
              pattern: '{{.csv}},'
            - field_name: gpReceiveTime
              pattern: '{{.csv}},'
            - field_name: gpSerial
              pattern: '{{.csv}},'
            - field_name: pa_type
              pattern: '{{.csv}},'
            - field_name: pa_subtype
              pattern: '{{.csv}},'
            - field_name: gpFutureUse2
              pattern: '{{.csv}},'
            - field_name: gpGenTime
              pattern: '{{.csv}},'
            - field_name: gpVsys
              pattern: '{{.csv}},'
            - field_name: panOSEventID
              pattern: '{{.csv}},'
            - field_name: gpStage
              pattern: '{{.csv}},'
            - field_name: gpAuthMethod
              pattern: '{{.csv}},'
            - field_name: gpTunnelType
              pattern: '{{.csv}},'
            - field_name: gpSrcUser
              pattern: '{{.csv}},'
            - field_name: gpSrcRegion
              pattern: '{{.csv}},'
            - field_name: gpMachine
              pattern: '{{.csv}},'
            - field_name: gpPublicIp
              pattern: '{{.csv}},'
            - field_name: gpPublicIpv6
              pattern: '{{.csv}},'
            - field_name: gpPrivateIp
              pattern: '{{.csv}},'
            - field_name: gpPrivateIpv6
              pattern: '{{.csv}},'
            - field_name: gpHostId
              pattern: '{{.csv}},'
            - field_name: gpSerial2
              pattern: '{{.csv}},'
            - field_name: gpClientVer
              pattern: '{{.csv}},'
            - field_name: gpClientOs
              pattern: '{{.csv}},'
            - field_name: gpClientOsVer
              pattern: '{{.csv}},'
            - field_name: gpRepeatCnt
              pattern: '{{.csv}},'
            - field_name: gpReason
              pattern: '{{.csv}},'
            - field_name: gpError
              pattern: '{{.csv}},'
            - field_name: message
              pattern: '{{.csv}},'
            - field_name: panOSEventStatus
              pattern: '{{.csv}},'
            - field_name: gpLocation
              pattern: '{{.csv}},'
            - field_name: gpLoginDuration
              pattern: '{{.csv}},'
            - field_name: gpConnectMethod
              pattern: '{{.csv}},'
            - field_name: gpErrorCode
              pattern: '{{.csv}},'
            - field_name: gpPortal
              pattern: '{{.csv}},'
          source: raw
          where: contains("raw", "GLOBALPROTECT") && !contains("raw", "CEF:")

      # ═══════════════════════════════════════════════════════════════════════
      # DECRYPTION CSV PATH  (no "CEF:" marker, field 5 == DECRYPTION)
      # ═══════════════════════════════════════════════════════════════════════
      # Decryption Syslog default field order. NOTE: Type is at field 5 (field 4
      # is empty), unlike THREAT/SYSTEM. Rule-relevant fields: Source Address(8)
      # -> origin.ip, Destination Address(9) -> target.ip, root_status(64) ->
      # panOSRootStatus (the cert-trust failure signal). {{.csv}} tolerates the
      # many empty columns.
      - grok:
          patterns:
            - field_name: decTrash1
              pattern: '{{.csv}},'
            - field_name: decTrash2
              pattern: '{{.csv}},'
            - field_name: decTrash3
              pattern: '{{.csv}},'
            - field_name: decTrash4
              pattern: '{{.csv}},'
            - field_name: pa_type
              pattern: '{{.csv}},'
            - field_name: decTrash6
              pattern: '{{.csv}},'
            - field_name: decTrash7
              pattern: '{{.csv}},'
            - field_name: decSrc
              pattern: '{{.csv}},'
            - field_name: decDst
              pattern: '{{.csv}},'
            - field_name: decTrash10
              pattern: '{{.csv}},'
            - field_name: decTrash11
              pattern: '{{.csv}},'
            - field_name: decTrash12
              pattern: '{{.csv}},'
            - field_name: decTrash13
              pattern: '{{.csv}},'
            - field_name: decTrash14
              pattern: '{{.csv}},'
            - field_name: decTrash15
              pattern: '{{.csv}},'
            - field_name: decTrash16
              pattern: '{{.csv}},'
            - field_name: decTrash17
              pattern: '{{.csv}},'
            - field_name: decTrash18
              pattern: '{{.csv}},'
            - field_name: decTrash19
              pattern: '{{.csv}},'
            - field_name: decTrash20
              pattern: '{{.csv}},'
            - field_name: decTrash21
              pattern: '{{.csv}},'
            - field_name: decTrash22
              pattern: '{{.csv}},'
            - field_name: decTrash23
              pattern: '{{.csv}},'
            - field_name: decTrash24
              pattern: '{{.csv}},'
            - field_name: decTrash25
              pattern: '{{.csv}},'
            - field_name: decTrash26
              pattern: '{{.csv}},'
            - field_name: decTrash27
              pattern: '{{.csv}},'
            - field_name: decTrash28
              pattern: '{{.csv}},'
            - field_name: decTrash29
              pattern: '{{.csv}},'
            - field_name: decTrash30
              pattern: '{{.csv}},'
            - field_name: decTrash31
              pattern: '{{.csv}},'
            - field_name: decTrash32
              pattern: '{{.csv}},'
            - field_name: decTrash33
              pattern: '{{.csv}},'
            - field_name: decTrash34
              pattern: '{{.csv}},'
            - field_name: decTrash35
              pattern: '{{.csv}},'
            - field_name: decTrash36
              pattern: '{{.csv}},'
            - field_name: decTrash37
              pattern: '{{.csv}},'
            - field_name: decTrash38
              pattern: '{{.csv}},'
            - field_name: decTrash39
              pattern: '{{.csv}},'
            - field_name: decTrash40
              pattern: '{{.csv}},'
            - field_name: decTrash41
              pattern: '{{.csv}},'
            - field_name: decTrash42
              pattern: '{{.csv}},'
            - field_name: decTrash43
              pattern: '{{.csv}},'
            - field_name: decTrash44
              pattern: '{{.csv}},'
            - field_name: decTrash45
              pattern: '{{.csv}},'
            - field_name: decTrash46
              pattern: '{{.csv}},'
            - field_name: decTrash47
              pattern: '{{.csv}},'
            - field_name: decTrash48
              pattern: '{{.csv}},'
            - field_name: decTrash49
              pattern: '{{.csv}},'
            - field_name: decTrash50
              pattern: '{{.csv}},'
            - field_name: decTrash51
              pattern: '{{.csv}},'
            - field_name: decTrash52
              pattern: '{{.csv}},'
            - field_name: decTrash53
              pattern: '{{.csv}},'
            - field_name: decTrash54
              pattern: '{{.csv}},'
            - field_name: decTrash55
              pattern: '{{.csv}},'
            - field_name: decTrash56
              pattern: '{{.csv}},'
            - field_name: decTrash57
              pattern: '{{.csv}},'
            - field_name: decTrash58
              pattern: '{{.csv}},'
            - field_name: decTrash59
              pattern: '{{.csv}},'
            - field_name: decTrash60
              pattern: '{{.csv}},'
            - field_name: decTrash61
              pattern: '{{.csv}},'
            - field_name: decTrash62
              pattern: '{{.csv}},'
            - field_name: decTrash63
              pattern: '{{.csv}},'
            - field_name: panOSRootStatus
              pattern: '{{.csv}},'
            - field_name: decChainStatus
              pattern: '{{.csv}},'
          source: raw
          where: contains("raw", ",DECRYPTION,") && !contains("raw", "CEF:")

      # ═══════════════════════════════════════════════════════════════════════
      # SHARED NORMALIZATION
      # ═══════════════════════════════════════════════════════════════════════

      # severityLabel is lowercased so it matches the rule contract
      # (rules test oneOf ["critical","high"]; CEF sends "High"/"Informational").
      - cast:
          fields:
            - log.severityLabel
          to: lower
          where: exists("log.severityLabel")

      - rename:
          from:
            - log.src
          to: origin.ip
          where: exists("log.src")
      # GLOBALPROTECT CSV: Public IP is the client actor IP.
      - rename:
          from:
            - log.gpPublicIp
          to: origin.ip
          where: exists("log.gpPublicIp") && !exists("origin.ip")
      # DECRYPTION CSV: Source Address(8) / Destination Address(9).
      - rename:
          from:
            - log.decSrc
          to: origin.ip
          where: exists("log.decSrc") && !exists("origin.ip")
      - rename:
          from:
            - log.decDst
          to: target.ip
          where: exists("log.decDst") && !exists("target.ip")
      # GLOBALPROTECT CSV: Portal/gateway host is the target.
      - rename:
          from:
            - log.gpPortal
          to: target.host
          where: exists("log.gpPortal") && !exists("target.host")
      - rename:
          from:
            - log.dst
          to: target.ip
          where: exists("log.dst")
      - rename:
          from:
            - log.duser
          to: target.user
          where: exists("log.duser")
      - rename:
          from:
            - log.suser
          to: origin.user
          where: exists("log.suser")
      - rename:
          from:
            - log.proto
          to: protocol
          where: exists("log.proto")

      # Geolocation enrichment
      - dynamic:
          plugin: com.hivearmor.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      - dynamic:
          plugin: com.hivearmor.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      - add:
          function: set
          params:
            key: log.dataType
            value: firewall-paloalto

      # ── Cleanup scratch fields ───────────────────────────────────────────────
      # Named CEF scratch + all positional-CSV scratch fields by prefix
      # (csv*, sys*, gp*, dec*, req*, cat*, msg* trash captures).
      - delete:
          fields:
            - log.cefPrefix
            - log.cefMsgAll
            - log.cefExtension
          prefixes:
            - reqTrash
            - catTrash
            - msgTrash
            - csvFutureUse
            - csvReceiveTime
            - csvSerial
            - csvGenTime
            - csvNat
            - csvRule
            - csvSrc
            - csvDst
            - csvApp
            - csvVsys
            - csvZone
            - csvIf
            - csvOut
            - csvIn
            - csvLog
            - csvSession
            - csvRepeat
            - csvPort
            - csvFlags
            - csvProto
            - csvUrlFilename
            - sysFutureUse
            - sysReceiveTime
            - sysSerial
            - sysGenTime
            - sysVsys
            - sysObject
            - sysModule
            - gpFutureUse
            - gpReceiveTime
            - gpSerial
            - gpGenTime
            - gpVsys
            - gpStage
            - gpAuthMethod
            - gpTunnelType
            - gpSrc
            - gpMachine
            - gpPublicIpv6
            - gpPrivate
            - gpHostId
            - gpSerial2
            - gpClient
            - gpRepeatCnt
            - gpReason
            - gpError
            - gpLocation
            - gpLogin
            - gpConnect
            - decTrash
