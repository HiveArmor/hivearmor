name: PR Checks

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'

# Cancel previous runs when new commits are pushed to the same PR.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  go_deps:
    name: Go deps
    uses: ./.github/workflows/_pr-reusable-go-deps.yml
    secrets:
      API_SECRET: ${{ secrets.API_SECRET }}

  # P1 Spike B — GAP-MT-05 dashboard tenant isolation (STAGING CANDIDATE hard gate)
  mssp_isolation:
    name: MSSP isolation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Dashboard tenant isolation IT (GAP-MT-05)
        env:
          MAVEN_TK: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -s settings.xml test
          -Dtest=DashboardTenantIsolationIT
          -DfailIfNoTests=true

  cel_pack:
    name: CEL pack
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: event-processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: event-processor/go.mod
          cache-dependency-path: event-processor/go.sum

      - name: Run CelPack tests
        run: go test ./rules/ -run CelPack -count=1

  ai_review:
    name: AI review
    uses: ./.github/workflows/_pr-reusable-ai-review.yml
    secrets:
      THREATWINDS_API_KEY: ${{ secrets.THREATWINDS_API_KEY }}
      THREATWINDS_API_SECRET: ${{ secrets.THREATWINDS_API_SECRET }}

  approver:
    name: Approver
    needs:
      - go_deps
      - mssp_isolation
      - cel_pack
      - ai_review
    uses: ./.github/workflows/_pr-reusable-approver.yml
    with:
      tier3_reviewers: 'EncryptShell'
    secrets:
      APPROVER_APP_ID: ${{ secrets.APPROVER_APP_ID }}
      APPROVER_PRIVATE_KEY: ${{ secrets.APPROVER_PRIVATE_KEY }}
      API_SECRET: ${{ secrets.API_SECRET }}

  all_checks_passed:
    name: All checks passed
    if: always()
    needs:
      - go_deps
      - mssp_isolation
      - cel_pack
      - ai_review
      - approver
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all required check jobs succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "Dependent job results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          # approver is a soft gate — it posts comments and tries to auto-approve
          # if the GitHub App is configured, but its failure does not block merges.
          # go_deps, mssp_isolation, cel_pack, and ai_review are hard gates.
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.key != "approver")
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')

          if [ -n "$failed" ]; then
            echo ""
            echo "❌ The following jobs did not succeed:"
            echo "$failed" | sed 's/^/  - /'
            exit 1
          fi

          echo ""
          echo "✅ All required checks passed."
