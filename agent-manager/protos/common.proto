syntax = "proto3";

option go_package = "github.com/hivearmor/agent-manager/agent";

package agent;

message ListRequest {
  int32 page_number = 1;
  int32 page_size = 2;
  string search_query = 3;
  string sort_by = 4;
  // Tenant scope for endpoint-scoped reads (agents/commands). Set server-side by the
  // backend from the authenticated identity (TenantContext), never from a client param.
  // Zero means "no tenant supplied" and is accepted ONLY under an explicit system context
  // (P0A1-T14); a normal MSSP read with tenant_id == 0 is rejected fail-closed by the manager.
  int64 tenant_id = 5;
}

enum Status {
  ONLINE = 0;
  OFFLINE = 1;
  UNKNOWN = 2;
}

enum ConnectorType{
  AGENT = 0;
  COLLECTOR = 1;
}

message AuthResponse {
  uint32 id = 1;
  string key = 2;
  // Tenant bound at collector registration. Zero means unbound (fail-closed at verify).
  int64 tenant_id = 3;
}

message DeleteRequest {
  string deleted_by = 1;
  uint32 agent_id = 2;
  int64 tenant_id = 3;
}
