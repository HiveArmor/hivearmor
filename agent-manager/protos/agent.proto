syntax = "proto3";

option go_package = "github.com/hivearmor/agent-manager/agent";

package agent;

import "google/protobuf/timestamp.proto";
import "common.proto";

service AgentService {
  rpc RegisterAgent(AgentRequest) returns (AuthResponse) {}
  rpc UpdateAgent(AgentRequest) returns  (AuthResponse) {}
  rpc DeleteAgent(DeleteRequest) returns (AuthResponse) {}
  rpc ListAgents (ListRequest) returns (ListAgentsResponse) {}
  rpc AgentStream(stream BidirectionalStream) returns (stream BidirectionalStream) {}
  rpc ListAgentCommands (ListRequest) returns (ListAgentsCommandsResponse) {}
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse) {}
  rpc ListEnrollmentTokens(ListEnrollmentTokensRequest) returns (ListEnrollmentTokensResponse) {}
  rpc RevokeEnrollmentToken(RevokeEnrollmentTokenRequest) returns (EnrollmentToken) {}
  rpc RotateAgentCredential(AgentCredentialRequest) returns (AgentCredentialResponse) {}
  rpc RevokeAgentCredential(AgentCredentialRequest) returns (AgentCredentialResponse) {}
  rpc ListEnrollmentAuditEvents(ListEnrollmentAuditEventsRequest) returns (ListEnrollmentAuditEventsResponse) {}
  rpc VerifyConnectorIdentity(VerifyConnectorIdentityRequest) returns (VerifyConnectorIdentityResponse) {}
  rpc ListConnectorAuthorization(ListConnectorAuthorizationRequest) returns (ListConnectorAuthorizationResponse) {}
}

service PanelService {
  rpc ProcessCommand (stream UtmCommand) returns (stream CommandResult){}
}

enum AgentCommandStatus {
  NOT_EXECUTED = 0;
  QUEUE = 1;
  PENDING = 2;
  EXECUTED = 3;
  ERROR = 4;
}

message AgentRequest {
  string ip = 1;
  string hostname = 2;
  string os = 3;
  string platform = 4;
  string version = 5;
  string register_by = 6;
  string mac = 7 ;
  string os_major_version = 8;
  string os_minor_version = 9;
  string aliases = 10;
  string addresses = 11;
}

message ListAgentsResponse {
  repeated Agent rows = 1;
  int32 total = 2;
}

message Agent {
  string ip = 1;
  string hostname = 2;
  string os = 3;
  Status status = 4;
  string platform = 5;
  string version = 6;
  string agent_key = 7;
  uint32 id = 8;
  string last_seen = 9;
  string mac = 10 ;
  string os_major_version = 11;
  string os_minor_version = 12;
  string aliases = 13;
  string addresses = 14;
  string agent_uuid = 15;
  int64 tenant_id = 16;
  uint32 credential_version = 17;
  google.protobuf.Timestamp credential_revoked_at = 18;
}

message CreateEnrollmentTokenRequest {
  int64 tenant_id = 1;
  string policy_id = 2;
  string platform = 3;
  google.protobuf.Timestamp expires_at = 4;
  int32 max_uses = 5;
  string created_by = 6;
}

message EnrollmentToken {
  string id = 1;
  int64 tenant_id = 2;
  string policy_id = 3;
  string platform = 4;
  google.protobuf.Timestamp expires_at = 5;
  int32 max_uses = 6;
  int32 use_count = 7;
  google.protobuf.Timestamp created_at = 8;
  string created_by = 9;
  google.protobuf.Timestamp last_used_at = 10;
  google.protobuf.Timestamp revoked_at = 11;
  string revoked_by = 12;
  string revocation_reason = 13;
  uint64 version = 14;
  string status = 15;
}

message CreateEnrollmentTokenResponse {
  EnrollmentToken enrollment = 1;
  string token = 2;
}

message ListEnrollmentTokensRequest {
  int64 tenant_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message ListEnrollmentTokensResponse {
  repeated EnrollmentToken rows = 1;
  int32 total = 2;
}

message RevokeEnrollmentTokenRequest {
  string id = 1;
  int64 tenant_id = 2;
  string revoked_by = 3;
  string reason = 4;
  uint64 expected_version = 5;
}

message AgentCredentialRequest {
  uint32 agent_id = 1;
  int64 tenant_id = 2;
  string actor = 3;
  string reason = 4;
}

message AgentCredentialResponse {
  uint32 agent_id = 1;
  string agent_uuid = 2;
  uint32 credential_version = 3;
  string key = 4;
  google.protobuf.Timestamp revoked_at = 5;
}

message EnrollmentAuditEvent {
  string id = 1;
  int64 tenant_id = 2;
  string event_type = 3;
  string actor = 4;
  string reason = 5;
  string token_id = 6;
  uint32 agent_id = 7;
  string agent_uuid = 8;
  string policy_id = 9;
  string platform = 10;
  uint32 credential_version = 11;
  uint64 enrollment_version = 12;
  google.protobuf.Timestamp occurred_at = 13;
}

message ListEnrollmentAuditEventsRequest {
  int64 tenant_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
  string token_id = 4;
  string agent_uuid = 5;
  string event_type = 6;
}

message ListEnrollmentAuditEventsResponse {
  repeated EnrollmentAuditEvent rows = 1;
  int64 total = 2;
}

message BidirectionalStream {
  oneof stream_message {
    UtmCommand command = 1;
    CommandResult result = 2;
  }
}

message UtmCommand {
  string agent_id = 1;
  string command = 2;
  string executed_by = 3;
  string cmd_id = 4;
  string origin_type = 5;
  string origin_id = 6;
  string reason = 7;
  string shell = 8; // Shell to execute command: "cmd", "powershell" (Windows), "sh", "bash" (Linux/macOS). Empty = default
}

message CommandResult {
  string agent_id = 1;
  string result = 2;
  google.protobuf.Timestamp executed_at = 3;
  string cmd_id = 4;
}

message ListAgentsCommandsResponse {
  repeated AgentCommand rows = 1;
  int32 total = 2;
}

message AgentCommand {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  uint32 agent_id = 3;
  string command = 4;
  AgentCommandStatus command_status = 5;
  string result = 6;
  string executed_by = 7;
  string cmd_id = 8;
  string reason = 9;
  string origin_type = 10;
  string origin_id = 11;
}

message VerifyConnectorIdentityRequest {
  uint32 connector_id = 1;
  string presented_key = 2;
  ConnectorType connector_type = 3;
}

message VerifyConnectorIdentityResponse {
  uint32 id = 1;
  string uuid = 2;
  int64 tenant_id = 3;
  uint32 credential_version = 4;
  bool revoked = 5;
  ConnectorType connector_type = 6;
}

message ListConnectorAuthorizationRequest {
  ConnectorType connector_type = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message ConnectorAuthorization {
  uint32 id = 1;
  string uuid = 2;
  int64 tenant_id = 3;
  bool revoked = 4;
  uint32 credential_version = 5;
  ConnectorType connector_type = 6;
}

message ListConnectorAuthorizationResponse {
  repeated ConnectorAuthorization rows = 1;
  int32 total = 2;
}
