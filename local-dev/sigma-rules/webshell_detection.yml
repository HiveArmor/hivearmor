title: Web Shell Process Spawning
id: c3f5e6a9-4d1b-4c8f-b3e7-0a9d8b5c2e4f
status: test
level: critical
description: Detects web server processes spawning command interpreters indicating web shell activity
author: HiveArmor Threat Research
date: 2024/07/01
modified: 2025/05/10
references:
  - https://attack.mitre.org/techniques/T1505/003/
tags:
  - attack.persistence
  - attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\tomcat*.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\bash.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Web application health check scripts
  - CGI scripts (rare in modern environments)
