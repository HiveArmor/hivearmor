title: Credential Dumping Tool Execution
id: a1d3c4e7-2b9f-4a6d-f1c5-8e7b6f3a0c2d
status: stable
level: critical
description: Detects execution of known credential dumping tools like Mimikatz
author: HiveArmor Threat Research
date: 2024/01/10
modified: 2025/05/01
references:
  - https://attack.mitre.org/techniques/T1003/
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_tools:
    Image|endswith:
      - '\mimikatz.exe'
      - '\procdump.exe'
      - '\secretsdump.py'
      - '\lazagne.exe'
  selection_commands:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'lsadump::sam'
      - 'lsadump::dcsync'
      - 'token::elevate'
  condition: selection_tools or selection_commands
falsepositives:
  - Penetration testing tools (when authorized)
  - Security assessment tools
