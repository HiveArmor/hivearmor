title: Data Exfiltration Over HTTP Large Upload
id: b2e4d5f8-3c0a-4b7e-a2d6-9f8c7a4b1d3e
status: experimental
level: high
description: Detects large HTTP POST requests to external destinations indicating data exfiltration
author: HiveArmor Threat Research
date: 2024/05/20
modified: 2025/04/15
references:
  - https://attack.mitre.org/techniques/T1048/003/
tags:
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: proxy
  product: generic
detection:
  selection:
    cs-method: POST
    sc-bytes|gte: 10485760
  filter_internal:
    dst_ip|startswith:
      - '10.'
      - '172.16.'
      - '192.168.'
  filter_known:
    cs-host|endswith:
      - '.microsoft.com'
      - '.amazonaws.com'
      - '.google.com'
  condition: selection and not filter_internal and not filter_known
falsepositives:
  - Large file uploads to legitimate cloud services
  - Backup solutions
  - Video conferencing uploads
