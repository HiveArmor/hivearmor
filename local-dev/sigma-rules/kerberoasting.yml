title: Kerberoasting Service Ticket Request
id: d5a7f0c4-9e6b-4d3a-c8f2-5b4e3c0d7f9a
status: test
level: high
description: Detects Kerberos TGS ticket requests with RC4 encryption for service accounts
author: HiveArmor Threat Research
date: 2024/03/01
modified: 2025/02/28
references:
  - https://attack.mitre.org/techniques/T1558/003/
tags:
  - attack.credential_access
  - attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
  filter_machine:
    ServiceName|endswith: '$'
  filter_krbtgt:
    ServiceName: 'krbtgt'
  condition: selection and not filter_machine and not filter_krbtgt
falsepositives:
  - Legacy applications requiring RC4 encryption
  - Older Windows systems
