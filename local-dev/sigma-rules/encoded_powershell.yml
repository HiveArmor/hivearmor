title: Encoded PowerShell Command Line
id: f4a6c5e2-3b1d-4a7e-9c8f-2d6b4e1a5f3c
status: test
level: high
description: Detects encoded or base64-obfuscated PowerShell command execution
author: HiveArmor Threat Research
date: 2024/03/15
modified: 2025/01/10
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
      - '-e '
  condition: selection
falsepositives:
  - Legitimate automation scripts using encoded commands
  - SCCM/Intune deployment scripts
