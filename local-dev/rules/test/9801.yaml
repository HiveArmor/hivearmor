- id: 9801
  dataTypes: [wineventlog, linux, syslog]
  name: "Risk: Failed Authentication"
  category: "Credential Access"
  technique: "T1110 - Brute Force"
  adversary: origin
  impact:
    confidentiality: 2
    integrity: 1
    availability: 1
  description: "Each failed auth adds 30 risk points. Alert fires at threshold (100)."
  riskScore: 30
  where: |
    equals("log.eventCode", "4625") ||
    equals("log.action", "failed_auth")
  groupBy: [origin.ip]
